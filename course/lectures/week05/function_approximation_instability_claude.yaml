slides:
  - id: G00
    kind: section
    title: 5.2 — Approximation instability
    subtitle: When sharing a value estimate changes the learning dynamics
    minutes: 0.5
    sources: ['section opener (as model_free_control P00 / bellman B17)']
    notes: |
      G00. Visible session boundary. Begin this slide at the second meeting, not as extra 5.1 material.

  - id: G01
    kind: math
    title: Can a useful update become self-reinforcing?
    body_box: [0.244, 1.1, 12.85, 1.4]
    size: 24
    body:
      - {eq: '\mathbf{w}\leftarrow\mathbf{w}+\alpha[R_{t+1}+\gamma\hat{v}(S_{t+1},\mathbf{w})-\hat{v}(S_t,\mathbf{w})]\mathbf{x}(S_t)'}
    after_box: [0.244, 2.9, 12.85]
    after:
      - 'Changing $\mathbf{w}$ changes the current prediction **and** future targets.'
      - 'We need to distinguish a stable compromise from growing error.'
    minutes: 2
    sources: ['old Value Function Approximation PPTX 41 (motivation, rewritten with the known update)']
    notes: |
      G01. Retrieve the three ingredients: shared features, the bootstrap target, and the data on which updates are
      made. Terminal continuation remains zero. Recall Week 4's tabular convergence conditions (4.2); replacing the
      table changes their applicability.

  - id: G02
    kind: math
    title: What would "converged" mean?
    drawing:
      - grid: {x: 11.3, y: 0.95, cell: 0.85, cols: 2, rows: 2, fills: {'2,2': goal}, labels: {'2,2': 'goal'}, arrows: {'1,1': right, '2,1': right, '1,2': right}, size: 11}
    body_box: [0.244, 0.95, 10.8, 1.6]
    size: 18
    body:
      - text: '**Computed best fit and TD fixed point, not sampled learning curves.**'
      - text: 'Grid: always right, $\gamma=0.5$, features (1, steps to goal); goal entry +1, otherwise −0.04. Episodes start at (1,1); every actual preterminal visit contributes.'
    table_box: [0.244, 2.75, 12.85]
    table:
      size: 18
      row_h: 0.5
      widths: [2.2, 1.8, 2.4, 3.0, 3.45]
      header: ['State', '$\mu(s)$', 'True $v^{\pi}$', 'Best fit for VE', 'TD fixed point']
      rows:
        - ['(1,1)', '9/82', '0.05091', '0.05091', '0.02099']
        - ['(2,1)', '36/41', '0.11636', '0.12623', '0.13319']
        - ['(1,2)', '1/82', '0.83636', '0.12623', '0.13319']
      total: ['Weighted squared error', '', '', '0.00624', '0.00638']
    after_box: [0.244, 5.9, 12.85]
    after:
      - text: '**Takeaway:** linear on-policy TD can settle at a stable point that is not the minimum of VE. A constant step size generally produces fluctuations rather than exact convergence.'
    minutes: 5
    sources: ['replaces old Value Function Approximation PPTX 24 (convergence claims)', 'book §§9.2–9.4, eqs. 9.1 and 9.12', 'check_function_approximation_claude.py §4']
    notes: |
      G02. Route minutes: full geometry 5, short 3 (O1). If 5.1 used the landmark example, introduce the grid from this
      inset; do not assume students saw the alternate. The full transition/reward specification is in F12-A's notes
      (0.8 intended move, 0.1 each perpendicular slip, walls keep the agent in place). True values and both limiting
      fits are computed from that model, not inferred from two samples or a simulation. The rarely visited upper-left
      cell (1,2) contributes little to this objective despite a large error. Every-visit and first-visit weighting
      differ. Full route: ask students to locate the largest error and explain the compromise. Short route: state
      those observations and keep the table's distinction. The standard linear-TD bounds need their distribution and
      task assumptions; no theorem or numerical error bound is claimed for this episodic example.

