      - {line: [1.1, 6.55, 6.1, 1.55]}
      - {label: 'Same features → equal predictions', box: [3.1, 1.2, 2.5, 0.6], size: 14}
      - {circle: [1.746, 1.904, 0.16], filled: true}
      - {label: '**True values**', box: [1.9, 1.62, 1.8, 0.4], size: 14, center: false}
      - {circle: [3.746, 3.904, 0.16]}
      - {label: 'Equal-state best fit', box: [3.95, 3.72, 2.6, 0.4], size: 14, center: false}
      - {circle: [1.801, 5.849, 0.14], filled: true}
      - {label: 'On-policy-weighted best fit', box: [2.6, 6.0, 3.2, 0.4], size: 14, center: false}
      - {line: [1.85, 5.9, 2.6, 6.2]}
