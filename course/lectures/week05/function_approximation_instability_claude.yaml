      - {line: [1.9, 5.75, 2.6, 5.35]}
      - {circle: [1.789, 2.107, 0.14]}
      - {label: 'Exact backup', box: [1.9, 2.12, 1.9, 0.4], size: 14, center: false}
      - {line: [1.74, 5.7, 1.74, 2.2], arrow: true}
      - {line: [1.86, 2.2, 1.86, 5.7], arrow: true}
      - {label: 'weighted best fit of the backup', box: [1.95, 3.6, 1.9, 0.7], size: 13, center: false}
    body_box: [7.1, 1.0, 6.0, 4.6]
    size: 17
    body:
      - '**A coordinate view of a three-state model.** Features (1, steps to goal): (2,1) and (1,2) share a feature vector, so representable pairs lie on the diagonal.'
      - 'Weights $\mu(2,1):\mu(1,2)=72:1$ pull the weighted fit close to $v^{\pi}(2,1)$; equal weights define a different objective.'
      - '**The start-state coordinate is independent of this pair.** Its true and best-fit value is 0.05091; its TD value, and its backup at that fixed point, are 0.02099.'
    footnote: 'Exact backup-and-fit picture of a fixed point; not the path of one sampled TD update.'
    reveal: [['draw:7:line', 'draw:8:label'], ['draw:9:circle', 'draw:10:label'], ['draw:11:circle', 'draw:12:label', 'draw:13:circle', 'draw:14:label', 'draw:15:line'], ['draw:16:circle', 'draw:17:label', 'draw:18:line'], ['draw:19:circle', 'draw:20:label', 'draw:21:line', 'draw:22:line', 'draw:23:label']]
    minutes: 6
    sources: ['new editable chart from G02 (old Value Function Approximation PPTX 49–50 as conceptual inspiration only; their 3D figure is not used, D5)', 'book §11.4', 'check_function_approximation_claude.py §8']
    notes: |
      G03-A · Alt A, geometry (picture P1, D5). Route minutes: full 6, short 4. Five clicks: (1) diagonal; (2) true
      values (0.11636, 0.83636); (3) equal-state best fit (0.47636, 0.47636) and on-policy-weighted best fit (0.12623,
      0.12623); (4) TD fixed point (0.13319, 0.13319); (5) exact backup (0.12394, 0.79971), arrow up from the TD point
      and arrow back to its weighted best fit. The weighted fit and the TD point are 0.007 apart, so their markers
      nearly coincide; the labels carry the distinction. Each pair value is w₁ + w₂; the start prediction is w₁ + 2w₂,
      so it can vary independently. Do not call this a slice with the start fixed at its true value, or say the start
      is always fitted exactly. The on-policy pair weights have ratio 72:1, which gives the near-horizontal compromise.
      At the TD fixed point a full exact backup gives (0.02098701, 0.12393766, 0.79970909) in the three-state order;
      fitting that backup using μ returns the same TD predictions. Only this full-vector interpretation justifies the
      return arrow. Full route: explain all five builds. Short route: show builds 1–4 and state the fixed-point
      interpretation without the backup arrows. Neither route teaches that each incremental TD step projects a whole
      value function.

  - id: G03-B
    kind: math
    alt: {choice: geometry, option: B}
    title: 'Alt B · Geometry: one weight, two predictions'
    drawing:
      - {line: [1.1, 6.6, 6.1, 6.6], arrow: true}
      - {line: [1.1, 6.6, 1.1, 1.0], arrow: true}
      - {label: 'v(L)', box: [3.0, 6.65, 1.5, 0.4], size: 15}
      - {label: 'v(R)', box: [1.2, 0.85, 1.0, 0.4], size: 15, center: false}
      - {label: '0', box: [0.75, 6.5, 0.3, 0.35], size: 13}
      - {label: '10', box: [5.38, 6.65, 0.45, 0.35], size: 13}
      - {label: '10', box: [0.6, 1.92, 0.45, 0.35], size: 13}
      - {line: [1.1, 6.6, 3.8, 1.2]}
      - {label: 'Representable: (w, 2w)', box: [1.45, 1.05, 2.3, 0.4], size: 14, center: false}
      - {circle: [5.15, 2.1, 0.16], filled: true}
      - {label: '**True values (9, 10)**', box: [5.3, 1.9, 1.75, 0.7], size: 14, center: false}
      - {circle: [3.71, 1.38, 0.14]}
      - {label: 'Equal weights: (5.8, 11.6)', box: [3.9, 1.15, 2.7, 0.4], size: 14, center: false}
      - {circle: [3.399, 2.003, 0.12]}
      - {label: 'Weights (0.1, 0.9): (5.11, 10.22)', box: [3.95, 2.95, 3.0, 0.4], size: 14, center: false}
      - {line: [3.44, 2.06, 3.95, 3.0]}
      - {circle: [3.35, 2.1, 0.12], filled: true}
      - {label: '**On-policy μ = (0, 1): best fit and TD fixed point (5, 10)**', box: [1.2, 2.55, 1.3, 1.25], size: 12, center: false}
      - {line: [3.3, 2.15, 2.5, 2.9]}
      - {line: [3.5, 1.96, 5.05, 1.96], arrow: true}
      - {line: [5.05, 2.24, 3.45, 2.24], arrow: true}
      - {label: 'exact backup, then fit', box: [3.95, 2.32, 2.0, 0.35], size: 12, center: false}
    body_box: [7.1, 1.0, 6.0, 4.9]
    size: 17
    body:
      - '**A separate two-state reward variant, for this picture only.** $\pi$ goes to R from either state; $\gamma=0.9$.'
      - 'L → R reward 0; R → R reward **+1**. Predictions $\hat{v}(L,w)=w$, $\hat{v}(R,w)=2w$.'
      - 'True values: (9, 10). Each weighting is a **different objective**.'
      - '**Rewards return to zero** for the divergence examples.'
    footnote: 'Exact backup-and-fit picture, not one sampled TD update.'
    reveal: [['draw:7:line', 'draw:8:label'], ['draw:9:circle', 'draw:10:label'], ['draw:11:circle', 'draw:12:label'], ['draw:13:circle', 'draw:14:label', 'draw:15:line'], ['draw:16:circle', 'draw:17:label', 'draw:18:line'], ['draw:19:line', 'draw:20:line', 'draw:21:label']]
    minutes: 6
    sources: ['new editable line diagram (D5 picture P2)', 'book §11.4 (best-fit/fixed-point distinction)', 'check_function_approximation_claude.py §8']
    notes: |
      G03-B · Alt B, geometry (picture P2, D5). Route minutes: full 6, short 4. Define the two states here even if the
      complete divergence example follows later. The three weighting choices are different objectives; do not use
      their different best fits as evidence that TD misses the best fit of the same objective. Here on-policy visits
      ultimately occur only at R, L has zero weight, and the TD fixed point also minimizes that on-policy objective.
      G02, separately, gives the same-objective example where TD and the best fit differ. The true values satisfy
      10 = 1 + 0.9(10) and 9 = 0.9(10). Equal weights: minimize (9 − w)² + (10 − 2w)², w = 5.8. Weights (0.1, 0.9):
      w = 189/37 ≈ 5.108. Builds: line; true values; equal-weight fit; (0.1, 0.9) fit; on-policy fit and TD fixed point;
      full route only: arrow from (5, 10) to its exact backup (9, 10) and back to its on-policy best fit (5, 10). Short
      route: omit the arrows, keep the weighting labels. Reset rewards to zero before either divergence construction;
      the +1 reward is not used to establish divergence.

  - id: G04
    kind: math
    title: A tabular guarantee does not transfer automatically
    body_box: [0.244, 1.2, 12.85, 5.0]
    size: 24
    body:
      - 'A Bellman backup and a best fit are different operations.'
      - 'The fit depends on both the function family and the state weighting.'
      - '**The tabular guarantee does not automatically survive fitting with a different state weighting.**'
    minutes: 2
    sources: ['old Value Function Approximation PPTX 41 (motivation)', 'book §11.4 (no contraction proof)', 'CS234 L4 p. 60', 'CS285 L8 pp. 30–36']
    notes: |
      G04. Route minutes: full 2, short 1. Week 2's discounted exact backup contracts differences between tables. The
      picture adds fitting in a particular weighted error measure; it does not prove the same statement for every
      approximate or sample-based update. Linear on-policy TD has stability results under appropriate conditions.
      Next: a concrete way different state frequencies and shared bootstrapped predictions can cause growth. No
      projection operator symbol, norm proof or gradient-TD algorithm.

  - id: I02
    kind: math
    alt: {choice: '5.2 divergence', option: A}
    title: 'Alt A · A single update raises its own target'
    pictures:
      - {deck: 'sources/current_course/6 - Value Function Approximation.pptx', slide: 43, shape: 'Picture 4', box: [3.9, 1.0, 5.5]}
    body_box: [0.244, 2.7, 12.85, 1.2]
    size: 20
    body:
      - text: '**Mechanism fragment, not yet a complete process.** $\hat{v}(L,w)=w$, $\hat{v}(R,w)=2w$; $R_{t+1}=0$, $\gamma=0.9$, $\alpha=0.1$, $w=10$. Supply L → R.'
    after_box: [0.244, 4.1, 12.85]
    after:
      - {eq: 'U_t=18,\quad\delta_t=8,\quad w\leftarrow10+0.1(8)(1)=10.8'}
      - text: 'Predictions move (10, 20) → (10.8, 21.6). **The update raises the target state''s prediction too.**'
    minutes: 3
    sources: ['old Value Function Approximation PPTX 43 (two-state picture; γ changed to 0.9, threshold claim deleted)', 'book §11.2 printed 260 / PDF 282']
    notes: |
      I02 · Alt A, 5.2 divergence (D3). The picture's states are L (value w) and R (value 2w). Ask what happens when R
      is updated: an isolated transition cannot answer. The next slide completes the task and specifies exactly which
      updates are made. If G03-B was used, explicitly announce the switch to all rewards zero.

  - id: I03
    kind: math
    alt: {choice: '5.2 divergence', option: A}
    title: 'Alt A · Complete the task and the update experiment'
    body_box: [0.244, 1.0, 12.85, 4.2]
    size: 19
    body:
      - 'Two states L, R; two actions "go L", "go R". Each action deterministically reaches its named state from either state.'
      - 'Continuing task; **all rewards 0**, $\gamma=0.9$. Thus $v^{\pi}(L)=v^{\pi}(R)=0$, exactly representable by $w=0$.'
      - 'Target $\pi$ always chooses "go R". Behaviour $b$ chooses each action with probability 1/2 at either state. Its stationary state frequencies are (1/2, 1/2); the target''s are (0, 1).'
    drawing:
      - {box: [0.6, 5.0, 12.1, 1.7], text: '**Rule of this experiment:** retain target-action transitions and balance the two source states. Each update uses one L → R and one R → R. Compute both contributions using the **same saved w**, average them, then apply α = 0.1 once.', tint: true, size: 18}
    minutes: 5
    sources: ['ChatGPT complete two-state construction (step 1, I03; review R03, C01)', 'old Value Function Approximation PPTX 43 (extended)', 'check_function_approximation_claude.py §7']
    notes: |
      I03 · Alt A, 5.2 divergence. C01 remains for instructor review (O3). This is an explicitly constructed
      mean-update experiment, not a generic prescription for off-policy learning. The symmetric behaviour can supply
      both retained transitions; its other transitions are deliberately not used under this experiment's rule. Do not
      say all off-policy algorithms discard non-target actions. No importance ratio, correction derivation or new
      off-policy algorithm; broader correction mechanisms belong to the later off-policy unit (Week 8). Distinguish
      the behaviour's state frequencies from the target continuation used in both labels.

  - id: I04
    kind: math
    alt: {choice: '5.2 divergence', option: A}
    title: 'Alt A · Work out the balanced update'
    body_box: [0.244, 1.0, 12.85, 1.0]
    size: 20
    body:
      - text: '$w=10$. Fill in both target-action transitions, average their **gradient-scaled errors**, and update once.'
    tables:
      - box: [0.244, 2.1, 12.85]
        size: 18
        row_h: 0.6
        widths: [2.0, 2.0, 1.9, 1.4, 1.5, 1.5, 2.55]
        header: ['Transition', 'Current prediction', 'Next prediction', 'Target', 'TD error', 'Gradient', 'Error × gradient']
        rows:
          - ['L → R', '10', '20', '?', '?', '?', '?']
          - ['R → R', '20', '20', '?', '?', '?', '?']
      - box: [0.244, 2.1, 12.85]
        size: 18
        row_h: 0.6
        widths: [2.0, 2.0, 1.9, 1.4, 1.5, 1.5, 2.55]
        header: ['Transition', 'Current prediction', 'Next prediction', 'Target', 'TD error', 'Gradient', 'Error × gradient']
        rows:
          - ['L → R', '10', '20', '18', '8', '1', '8']
          - ['R → R', '20', '20', '18', '−2', '2', '−4']
    blocks:
      - box: [0.244, 4.3, 12.85, 1.6]
        size: 20
        items:
          - 'Mean contribution = (8 − 4)/2 = 2; **w = 10.2**. Repeating from the new saved weight gives **10.404**.'
    reveal: [['yaml:tables.1', 'yaml:blocks.0']]
    minutes: 8
    sources: ['ChatGPT complete two-state construction (I04)', 'check_function_approximation_claude.py §7']
    notes: |
      I04 · Alt A, 5.2 divergence. Give about four minutes to work and pair-check, then feedback. Averaging raw TD
      errors, or updating w between the rows, implements a different experiment. At general w the two contributions are
      0.8w and −0.4w; their mean is 0.2w. Full-geometry route: reveal I05's recurrence during the remaining feedback
      time; it has no additional minutes. Short route: leave the recurrence to the separately timed I05.

  - id: I05
    kind: math
    alt: {choice: '5.2 divergence', option: A}
    title: 'Alt A · A small growth factor compounds'
    body_box: [0.244, 1.1, 12.85, 1.4]
    size: 24
    body:
      - {eq: 'w\leftarrow w+\alpha(0.2w)=1.02w\qquad(\gamma=0.9,\ \alpha=0.1)'}
    after_box: [0.244, 2.8, 12.85]
    after:
      - '10 → 10.2 → 10.404 → … . True values stay zero.'
      - 'Both predictions grow in magnitude.'
      - 'A smaller positive step size slows growth in this experiment; it does not change its direction.'
    minutes: 0
    sources: ['ChatGPT complete two-state construction (I05)', 'old Value Function Approximation PPTX 43 (threshold sentence omitted)']
    notes: |
      I05 · Alt A, 5.2 divergence. Route minutes: within I04's eight minutes in the full-geometry route (0 here); 4 in
      the short-geometry route. Only the numeric γ = 0.9 case is shown live, with no discount threshold (D7, C02 second
      bullet). This is an exact deterministic mean recurrence, not a claim that every stochastic sample path grows
      monotonically. The Baird picture at G10 supplies the larger-scale visual; C02's first bullet (a growth chart)
      remains for instructor review. Do not add an unaccepted extra time block for a second growth chart.

  - id: I06
    kind: math
    alt: {choice: '5.2 divergence', option: A}
    title: 'Alt A · Locate the three ingredients'
    pictures:
      - {deck: 'sources/current_course/6 - Value Function Approximation.pptx', slide: 47, shape: 'Picture 3', box: [8.9, 1.0, 4.0]}
    body_box: [0.244, 1.0, 8.4, 3.8]
    size: 19
    body:
      - '**Function approximation:** one weight couples L and R.'
      - '**Bootstrapping:** predictions appear in the target.'
      - '**Off-policy state weighting:** equal source-state updates differ from target-policy visits.'
    after_box: [0.244, 5.0, 12.85]
    after:
      - text: '**Does the target represent the right continuation? Which states dominate the updates?**'
    minutes: 4
    sources: ['old Value Function Approximation PPTX 47 (triad picture)', 'book §11.3', 'Sutton slides 26 p. 4', 'Week 4 P08 callback']
    notes: |
      I06 · Alt A, 5.2 divergence. Includes the G09 callback (two off-policy questions). The experiment makes the
      target continuation exact, yet the state-frequency mismatch remains. Recall Week 4 P08: learning from someone
      else's data raises both questions; neither was solved generally by Week 4's Q-learning target. No correction
      formula. The deadly triad names a mechanism allowing failure, not a statement that every such method diverges or
      that any arbitrary pair of ingredients is safe.

