  - id: F15
    kind: math
    title: Action values use the same machinery
    body_box: [0.244, 1.0, 12.85, 2.0]
    size: 22
    body:
      - {eq: '\hat{q}(s,a,\mathbf{w})=\mathbf{w}^{\top}\mathbf{x}(s,a)'}
      - {eq: '\mathbf{w}\leftarrow\mathbf{w}+\alpha[U_t-\hat{q}(S_t,A_t,\mathbf{w})]\nabla\hat{q}(S_t,A_t,\mathbf{w})'}
    table_box: [0.6, 3.3, 12.1]
    table:
      size: 20
      row_h: 0.6
      align_left: true
      widths: [4.0, 8.1]
      header: ['Method', 'Nonterminal target $U_t$']
      rows:
        - ['Semi-gradient Sarsa', '$R_{t+1}+\gamma\hat{q}(S_{t+1},A_{t+1},\mathbf{w})$']
        - ['Approximate Q-learning', '$R_{t+1}+\gamma\max_a\hat{q}(S_{t+1},a,\mathbf{w})$']
    after_box: [0.244, 5.4, 12.85]
    after:
      - '**Terminal target:** $U_t=R_{t+1}$. In the linear case, the gradient is $\mathbf{x}(S_t,A_t)$.'
    minutes: 2
    sources: ['old Value Function Approximation PPTX 25–29 and 31 (equations regenerated; P27''s zero-error expression fixed)', 'book §10.1']
    notes: |
      F15. The action is part of the prediction input (or selects an output). Recall Week 4's sampled-next-action
      versus greedy target; the behaviour/target distinction survives replacing the table. Expected SARSA was exposed
      there, but no extra approximate algorithm is added here. These equations are update rules, not tabular
      convergence guarantees. Old P27 wrote the error as prediction minus itself; here it is target minus prediction.
      Old P30 (Q-Pacman) is removed (D8).

  - id: F15a
    kind: math
    title: 'Semi-gradient Sarsa: keep the sampled next action'
    body_box: [0.244, 1.0, 12.85, 5.9]
    size: 19
    body:
      - text: '1. Initialize $\mathbf{w}$. At an episode start $S_0$, choose $A_0$ ε-greedily from $\hat{q}(S_0,\cdot,\mathbf{w})$.'
      - text: '2. Execute $A_t$; observe $R_{t+1}$, $S_{t+1}$.'
      - text: '3. If terminal, set $U_t=R_{t+1}$.'
      - text: '4. Otherwise choose $A_{t+1}$ ε-greedily using the current weights, and set $U_t=R_{t+1}+\gamma\hat{q}(S_{t+1},A_{t+1},\mathbf{w})$.'
      - text: '5. Update $\mathbf{w}\leftarrow\mathbf{w}+\alpha[U_t-\hat{q}(S_t,A_t,\mathbf{w})]\nabla\hat{q}(S_t,A_t,\mathbf{w})$, all quantities on the right evaluated before the update.'
      - text: '6. If nonterminal, **execute that same** $A_{t+1}$ **next**. If terminal, restart.'
    minutes: 2
    sources: ['old Value Function Approximation PPTX 32 (semi-gradient Sarsa box, replaced by this loop in course notation)', 'book §10.1 box printed 244 / PDF 266']
    notes: |
      F15a. Greedy ties are broken uniformly; exploratory choice is uniform over available actions. Do not draw
      another action after the update and pretend it was the one used in the Sarsa target. A changing policy makes this
      control, so fixed-policy prediction results do not by themselves guarantee control convergence.

