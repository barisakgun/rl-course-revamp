  title: Function approximation (sessions 5.1–5.2)
  author: Barış Akgün
  term: Fall 2026

slides:
  - id: F00
    kind: course_title
    title: COMP438/538 Reinforcement Learning
    topic: Function Approximation
    minutes: 0.5
    sources: ['old Value Function Approximation PPTX 1 (title), Introduction title format']
    notes: |
      F00. One deck across two meetings; this meeting is 5.1, Linear approximation and semi-gradients. Today we
      replace independent table entries with shared weights.

  - id: F01
    kind: math
    title: From tables to generalization
    body_box: [0.244, 1.1, 12.85, 2.0]
    size: 24
    body:
      - {eq: 'V(S_t)\leftarrow V(S_t)+\alpha[U_t-V(S_t)]'}
    after_box: [0.244, 2.6, 12.85]
    after:
      - 'MC: the target $U_t$ is a return.'
      - 'TD: the target bootstraps from another estimate.'
      - 'A table update directly changes **one entry**.'
      - text: '**Question:** Can experience improve predictions at other states?'
    minutes: 2
    sources: ['old Value Function Approximation PPTX 3 (recap, reduced to the update form)', 'Week 4 P10']
    notes: |
      F01. Recall Week 4's final question (P10, From tables to generalization). Prediction still means estimating a
      fixed policy's values; control adds policy improvement later. Answer: shared parameters can transfer an update
      across states, for better or worse.

  - id: F02
    kind: math
    title: Too many states, too little experience
    pictures:
      - {file: course/lectures/week05/assets/pacman_states_claude.png, box: [0.5, 1.05, 7.6]}
    body_box: [8.4, 1.1, 4.7, 4.2]
    size: 20
    body:
      - '**Storage is only half the problem.**'
      - 'Large or continuous spaces make repeated visits scarce.'
      - 'Similar situations may have related values.'
      - 'A representation decides which similarities matter.'
    after_box: [0.5, 4.4, 12.3]
    after:
      - text: '**Question:** Two Pacman positions differ by one square. What information could make their values similar, or very different?'
    minutes: 3
    sources: ['old Value Function Approximation PPTX 4–5 (scale argument; P5 Pacman boards cropped from the old PDF export)']
    notes: |
      F02. The three boards are old P5's (cropped from the old deck's PDF export because they are grouped composites).
      Invite food/ghost distances and obstacles. Nearby positions separated by a wall or a dangerous ghost need not
      have similar values. A table makes no direct cross-state parameter update; do not say it can never propagate
      information through TD backups. No numerical state-count claims (old P4's are removed).

  - id: F03
    kind: math
    title: What must the approximator handle?
    body_box: [0.244, 1.1, 12.85, 1.0]
    size: 24
    body:
      - text: '**What would you use to predict value from a description of a state?**'
    blocks:
      - box: [0.6, 2.2, 12.0, 3.2]
        size: 22
        items:
          - 'A compact representation'
          - 'Updates from experience'
          - 'Generalization to similar states'
          - 'Useful gradients for updating the weights'
    reveal: ['yaml:blocks.0']
    minutes: 3
    sources: ['old Value Function Approximation PPTX 8–9 (approximator list and requirements, reduced)']
    notes: |
      F03. About one minute of brainstorming, then reveal the four requirements. Connect linear models and neural
      networks to supervised regression. RL adds correlated experience, action-dependent data and potentially changing
      targets. A differentiable model makes updates possible; it does not remove these problems. We begin with linear
      models so we can inspect the mechanism.

  - id: F04
    kind: math
    title: A value estimate is now a function
    body_box: [0.244, 1.0, 12.85, 1.2]
    size: 24
    body:
      - {eq: '\hat{v}(s,\mathbf{w})\approx v^{\pi}(s),\qquad\hat{q}(s,a,\mathbf{w})\approx q^{\pi}(s,a)'}
    drawing:
      - {box: [1.2, 3.4, 2.2, 1.4], text: '**shared weights 𝐰**'}
      - {box: [5.55, 3.4, 2.2, 1.4], text: '**shared weights 𝐰**'}
      - {box: [9.9, 3.4, 2.2, 1.4], text: '**shared weights 𝐰**', tint: true}
      - {line: [2.3, 5.5, 2.3, 4.8], arrow: true}
      - {line: [2.3, 3.4, 2.3, 2.7], arrow: true}
      - {line: [6.15, 5.5, 6.15, 4.8], arrow: true}
      - {line: [7.15, 5.5, 7.15, 4.8], arrow: true}
      - {line: [6.65, 3.4, 6.65, 2.7], arrow: true}
      - {line: [11.0, 5.5, 11.0, 4.8], arrow: true}
      - {line: [10.3, 3.4, 10.3, 2.7], arrow: true}
      - {line: [11.0, 3.4, 11.0, 2.7], arrow: true}
      - {line: [11.7, 3.4, 11.7, 2.7], arrow: true}
      - {label: 'state s', box: [1.3, 5.5, 2.0, 0.45], size: 18}
      - {label: 'state s, action a', box: [5.15, 5.5, 3.0, 0.45], size: 18}
      - {label: 'state s', box: [10.0, 5.5, 2.0, 0.45], size: 18}
      - {label: 'v̂(s, 𝐰)', box: [1.3, 2.2, 2.0, 0.45], size: 18}
      - {label: 'q̂(s, a, 𝐰)', box: [5.65, 2.2, 2.0, 0.45], size: 18}
      - {label: 'one value per discrete action', box: [9.4, 2.2, 3.2, 0.45], size: 16}
    after_box: [0.244, 6.1, 12.85, 0.9]
    after:
      - text: 'Many predictions typically share far fewer weights than a table has entries.'
    size: 20
    eq_size: 24
    minutes: 2
    sources: ['old Value Function Approximation PPTX 7 (input/output diagram, redrawn natively in course notation)', 'Silver L6 p. 7']
    notes: |
      F04. The diagram redraws old P7's three input/output panels in course notation (v̂, q̂, bold w). **w** is a
      vector of adjustable numbers, not a policy. The hat distinguishes a prediction from the true value. Fix π while
      developing prediction; there is no guarantee that all value functions fit this family. "Fewer weights" is a
      useful motivation, not a defining mathematical requirement. A network can output one value per discrete action
      (right panel; DQN in Week 6).

  - id: F05
    kind: math
    title: Which prediction errors matter?
    body_box: [0.244, 1.1, 12.85, 1.4]
    size: 24
    body:
      - {eq: '\mathrm{VE}(\mathbf{w})=\sum_{s\in\mathcal{S}}\mu(s)[v^{\pi}(s)-\hat{v}(s,\mathbf{w})]^2'}
    after_box: [0.244, 2.8, 12.85]
    after:
      - '$\mu(s)$: on-policy state weighting, summing to one.'
      - 'Shared weights may force a compromise: errors at heavily weighted states count more.'
      - text: '**Question:** Can a small average error hide a large error at a rarely visited state?'
    minutes: 3
    sources: ['old Value Function Approximation PPTX 13 (objective; J(w) replaced by VE(w), notation guide D6)', 'book §9.2 eq. 9.1 printed 199 / PDF 221']
    notes: |
      F05. Answer: yes. This is an evaluation objective, not a target we can directly observe. The distribution and
      the representation are separate choices. For the grid later: episodes start at (1,1), and every actual
      preterminal visit contributes; this gives the physical-visit weighting declared in G02. It differs from
      first-visit sampling and from alternative discount-as-termination conventions. Do not derive occupancy weights
      here.

  - id: F06
    kind: math
    title: If an oracle gave us the value
    body_box: [0.244, 1.1, 12.85, 2.6]
    size: 24
    body:
      - {eq: '\nabla_{\mathbf{w}}\frac{1}{2}[v^{\pi}(s)-\hat{v}(s,\mathbf{w})]^2=-[v^{\pi}(s)-\hat{v}(s,\mathbf{w})]\nabla\hat{v}(s,\mathbf{w})'}
      - {eq: '\mathbf{w}\leftarrow\mathbf{w}+\alpha[v^{\pi}(s)-\hat{v}(s,\mathbf{w})]\nabla\hat{v}(s,\mathbf{w})'}
    after_box: [0.244, 3.9, 12.85]
    after:
      - '**Prediction error × sensitivity to the weights.**'
      - 'Replace the inaccessible true value by a target from experience.'
    minutes: 3
    sources: ['old Value Function Approximation PPTX 11 and 13 (squared error and gradient, regenerated; the full-batch equivalence sentence is omitted, D7)', 'book eqs. 9.4–9.5']
    notes: |
      F06. ∇ means the gradient with respect to **w**, not with respect to the state. The negative loss gradient gives
      the plus sign in the update. Sampling states with the chosen weights gives a stochastic-gradient route to the
      weighted objective. The half absorbs the factor two; no new objective symbol is needed.

  - id: F07
    kind: math
    title: Monte Carlo supplies a target
    body_box: [0.244, 1.1, 12.85, 1.4]
    size: 24
    body:
      - {eq: 'U_t=G_t,\qquad\mathbf{w}\leftarrow\mathbf{w}+\alpha[G_t-\hat{v}(S_t,\mathbf{w})]\nabla\hat{v}(S_t,\mathbf{w})'}
    after_box: [0.244, 2.8, 12.85]
    after:
      - 'Fixed-policy trajectories supply noisy return labels.'
      - 'Wait until the return is available; update the prediction toward it.'
    minutes: 3
    sources: ['old Value Function Approximation PPTX 14 (general SGD update, shortened)', 'book §9.3, gradient MC box printed 202 / PDF 224']
    notes: |
      F07. Every-visit gradient MC uses each visit's return, unlike the first-visit sample-average example in Week 3.
      State this distinction once. For a fixed policy the conditional mean return is v^π(s); appropriate sampling and
      step-size assumptions are needed for convergence. Linear models have a convex squared-error objective;
      nonlinear models do not inherit a global-optimum guarantee. Do not claim that constant-step MC converges exactly
      or that all nonlinear methods reach a local minimum.

  - id: F08
    kind: math
    title: TD supplies a moving target
    body_box: [0.244, 1.0, 12.85, 2.2]
    size: 24
    body:
      - {eq: 'U_t=R_{t+1}+\gamma\hat{v}(S_{t+1},\mathbf{w}),\qquad\delta_t=U_t-\hat{v}(S_t,\mathbf{w})'}
      - {eq: '\mathbf{w}\leftarrow\mathbf{w}+\alpha\delta_t\nabla\hat{v}(S_t,\mathbf{w})'}
    after_box: [0.244, 3.3, 12.85, 2.6]
    after:
      - '**Semi-gradient:** differentiate the current prediction; treat the target as fixed in this update.'
      - 'The target also depends on $\mathbf{w}$. This is **not, in general, a true gradient method** for the value-error objective.'
    blocks:
      - box: [0.244, 6.1, 12.85, 0.6]
        size: 16
        items:
          - text: '*I might refer to these as gradient methods in class.*'
    minutes: 3.5
    sources: ['old Value Function Approximation PPTX 15 (disclaimer kept, D7; blanket linear-convergence sentence replaced)', 'book §9.3 printed 202–203 / PDF 224–225']
    notes: |
      F08 (with F08a: a 5-minute block). Bootstrap immediately instead of waiting for an episode. If you differentiate
      the sampled half-squared TD error fully, the derivative also contains the next prediction's derivative; the
      displayed rule deliberately omits that part. Do not turn this into a residual-gradient derivation. Terminal
      continuation is zero. The formal name remains semi-gradient even with the instructor's shorthand.

  - id: F08a
    kind: math
    title: 'Semi-gradient TD: the loop'
    body_box: [0.244, 1.0, 12.85, 5.8]
    size: 21
    body:
      - text: '1. Initialize $\mathbf{w}$; run the fixed policy $\pi$.'
      - text: '2. At nonterminal $S_t$, take $A_t\sim\pi(\cdot\mid S_t)$; observe $R_{t+1}$, $S_{t+1}$.'
      - text: '3. If terminal: $U_t=R_{t+1}$. Otherwise: $U_t=R_{t+1}+\gamma\hat{v}(S_{t+1},\mathbf{w})$.'
      - text: '4. Compute $\delta_t=U_t-\hat{v}(S_t,\mathbf{w})$ and $\nabla\hat{v}(S_t,\mathbf{w})$ using the **same pre-update weights**.'
      - text: '5. Update $\mathbf{w}\leftarrow\mathbf{w}+\alpha\delta_t\nabla\hat{v}(S_t,\mathbf{w})$. Continue, or restart after termination.'
    minutes: 1.5
    sources: ['old Value Function Approximation PPTX 16 (algorithm picture replaced by this loop in course notation)', 'book semi-gradient TD(0) box printed 203 / PDF 225']
    notes: |
      F08a, within F08's five-minute block. No terminal-state feature or gradient is needed. Ask which two
      predictions use the old weights: both the current and the next. This becomes the invariant in the numerical
      exercise.

  - id: F09
    kind: math
    title: Linear in the weights
    body_box: [0.244, 1.0, 12.85, 2.6]
    size: 24
    body:
      - {eq: '\hat{v}(s,\mathbf{w})=\mathbf{w}^{\top}\mathbf{x}(s)=\sum_{i=1}^{d}w_i x_i(s)'}
      - {eq: '\nabla\hat{v}(s,\mathbf{w})=\mathbf{x}(s),\qquad\mathbf{w}\leftarrow\mathbf{w}+\alpha\delta_t\mathbf{x}(S_t)'}
    after_box: [0.244, 3.7, 12.85]
    after:
      - '**Linear in $\mathbf{w}$. Features may be nonlinear functions of the input.**'
      - 'A constant feature can supply an intercept.'
      - 'One-hot features recover the tabular update.'
    minutes: 3
    sources: ['old Value Function Approximation PPTX 20 (linear value function and update, f → x)', 'book §9.4 eqs. 9.8–9.9 printed 204–205 / PDF 226–227']
    notes: |
      F09. A distance, square, tile indicator or cosine feature can be nonlinear in the raw state description while the
      value remains linear in the adjustable weights. One-hot features recover the tabular update. Each feature scales
      a component's change; a zero feature leaves that component unchanged.

  - id: F10
    kind: math
    title: Features decide what the learner can distinguish
    pictures:
      - {file: course/lectures/week05/assets/pacman_board_claude.png, box: [8.6, 1.1, 4.3]}
    body_box: [0.244, 1.1, 8.1, 5.6]
    size: 22
    body:
      - 'Example features $x_i(s)$:'
      - {sub: ['a constant', 'distance to food', 'distance to a ghost', 'indicators for nearby danger']}
      - '**Which distinctions have we thrown away?**'
      - 'Identical feature vectors force identical predictions for every $\mathbf{w}$.'
    minutes: 3
    sources: ['old Value Function Approximation PPTX 18–19 (feature list and Pacman board, cropped from the old PDF export; f → x)']
    notes: |
      F10. A useful feature must be computable from the agent's available information. Distance alone may omit walls
      or direction. Distinguish an omitted feature of a fully observed state from information unavailable in the
      observation (Week 1). More weights cannot recover absent information without changing the inputs or state
      representation.

  - id: F11
    kind: math
    title: How much should states share?
    drawing:
      - grid: {x: 0.7, y: 1.3, cell: 0.75, cols: 4, rows: 4, coords: false, fills: {'2,3': pit}}
      - grid: {x: 4.75, y: 1.3, cell: 0.75, cols: 4, rows: 4, coords: false, fills: {'1,3': pit, '2,3': pit, '1,4': pit, '2,4': pit}}
      - {outline: [4.75, 1.3, 1.5, 1.5]}
      - {outline: [6.25, 1.3, 1.5, 1.5]}
      - {outline: [4.75, 2.8, 1.5, 1.5]}
      - {outline: [6.25, 2.8, 1.5, 1.5]}
      - {line: [8.8, 1.3, 11.8, 1.3]}
      - {line: [8.8, 2.3, 11.8, 2.3]}
      - {line: [8.8, 3.3, 11.8, 3.3]}
      - {line: [8.8, 4.3, 11.8, 4.3]}
      - {line: [8.8, 1.3, 8.8, 4.3]}
      - {line: [9.8, 1.3, 9.8, 4.3]}
      - {line: [10.8, 1.3, 10.8, 4.3]}
      - {line: [11.8, 1.3, 11.8, 4.3]}
      - {line: [9.2, 1.7, 12.2, 1.7]}
      - {line: [9.2, 2.7, 12.2, 2.7]}
      - {line: [9.2, 3.7, 12.2, 3.7]}
      - {line: [9.2, 1.7, 9.2, 4.7]}
      - {line: [10.2, 1.7, 10.2, 4.7]}
      - {line: [11.2, 1.7, 11.2, 4.7]}
      - {line: [12.2, 1.7, 12.2, 4.7]}
      - {outline: [9.8, 2.3, 1.0, 1.0]}
      - {outline: [10.2, 2.7, 1.0, 1.0]}
      - {circle: [10.55, 2.95, 0.16], filled: true}
      - {label: '**One-hot:** one weight per cell', box: [0.5, 4.45, 3.4, 0.5], size: 16}
      - {label: '**Aggregation:** one value per group', box: [4.55, 4.45, 3.4, 0.5], size: 16}
      - {label: '**Two offset tilings:** a state activates one tile in each', box: [8.6, 4.85, 4.0, 0.5], size: 16}
    after_box: [0.244, 5.45, 12.85, 1.4]
    size: 18
    after:
      - 'Overlapping tiles (coarse coding): nearby states share some active weights. RBFs: smooth local features. Fourier features: a fixed basis of oscillations.'
    minutes: 2
    sources: ['old Value Function Approximation PPTX 21 (feature menu, reduced to one drawn comparison)', 'book §9.5 (tile coding)', 'Sutton slides 18-19 pp. 23–27']
    notes: |
      F11. Contrast one-hot with overlapping sharing. Left: one highlighted cell has its own weight. Middle: a group
      (shaded) shares one value. Right: two offset tilings; the dot activates one tile in each (red outlines), so a
      nearby state shares some, not all, active weights. More flexible features can improve representability but
      change the update coupling too. RBF and Fourier are names and intuition only; no feature-engineering derivation
      or homework requirement. The old "any known function" claim and the old reading instruction are removed.

  - id: F12-A
    kind: math
    alt: {choice: '5.1 example', option: A}
    title: 'Alt A · Grid: two weights for three states'
    drawing:
      - grid: {x: 10.3, y: 1.0, cell: 1.35, cols: 2, rows: 2, fills: {'2,2': goal}, labels: {'1,1': '(1,1) start', '2,1': '(2,1)', '1,2': '(1,2)', '2,2': 'goal'}, arrows: {'1,1': right, '2,1': right, '1,2': right}, size: 14}
    body_box: [0.244, 1.0, 9.8, 2.6]
    size: 20
    eq_size: 22
    body:
      - 'Coordinates = (column, row). Policy: always right. $\gamma=0.5$, $\alpha=0.1$.'
      - 'Goal entry: +1 total; other transitions: −0.04; terminal continuation: 0.'
      - {eq: '\mathbf{x}(s)=(1,\ \text{steps}\ \text{to}\ \text{goal})^{\top},\qquad\mathbf{w}=(0.6,-0.2)^{\top}'}
    table_box: [0.6, 4.0, 8.4]
    table:
      size: 20
      row_h: 0.55
      widths: [2.4, 2.6, 3.4]
      header: ['State', 'Features', 'Initial prediction']
      rows:
        - ['(1,1)', '(1, 2)', '0.20']
        - ['(2,1)', '(1, 1)', '0.40']
        - ['(1,2)', '(1, 1)', '0.40']
    minutes: 3
    sources: ['accepted 2×2 grid (bellman B03; γ = 0.5)', 'old Value Function Approximation PPTX 20 (equation layout only)', 'check_function_approximation_claude.py §2']
    notes: |
      F12-A · Alt A, 5.1 example (D2). For reference values the full model is: intended direction 0.8, each
      perpendicular slip 0.1; walls leave the state unchanged. Students need only the supplied samples to update. The
      goal is not approximated. First identify the two aliased cells: (2,1) and (1,2) are distinct states with
      identical features.

  - id: F12a-A
    kind: math
    alt: {choice: '5.1 example', option: A}
    title: 'Alt A · Two samples pull shared weights'
    body_box: [0.244, 1.0, 12.85, 2.2]
    size: 20
    body:
      - text: 'Compute the target, TD error, new weights and all three predictions. Use the current weights for both predictions in each target.'
      - '**Sample A:** (1,2), right, +1, goal.'
      - '**Sample B:** (2,1), right, −0.04, (2,1), starting with the weights obtained from A. *A separately supplied sample, not the next transition after termination.*'
    tables:
      - box: [0.244, 3.6, 12.85]
        size: 18
        row_h: 0.6
        widths: [1.3, 3.4, 1.4, 3.0, 3.75]
        header: ['Sample', '$U_t$', '$\delta_t$', 'New weights', 'Predictions at (1,1), (2,1), (1,2)']
        rows:
          - ['A', '1', '0.6', '(0.66, −0.14)', '(0.38, 0.52, 0.52)']
          - ['B', '−0.04 + 0.5(0.52) = 0.22', '−0.30', '(0.63, −0.17)', '(0.29, 0.46, 0.46)']
    reveal: ['yaml:tables.0']
    minutes: 5
    sources: ['constructed (check_function_approximation_claude.py §2)', 'old MT1 Spring 2025 Q4 (exercise format)']
    notes: |
      F12a-A · Alt A, 5.1 example. Protect about three minutes of student calculation and two of feedback before the
      click that reveals the table. A changes both components by +0.06; B changes both by −0.03. The non-visited cells
      move too, and the start cell moves by three times the component increment (its features are (1, 2)). Sample B
      is possible because a right move meets the wall. Two samples are not evidence of convergence.

  - id: F13-A
    kind: math
    alt: {choice: '5.1 example', option: A}
    title: 'Alt A · Is the representation sufficient?'
    table_box: [0.6, 1.1, 8.0]
    table:
      size: 20
      row_h: 0.55
      widths: [2.0, 3.4, 2.6]
      header: ['State', 'True $v^{\pi}$, always right', 'Prediction after B']
      rows:
        - ['(1,1)', '0.05091', '0.29']
        - ['(2,1)', '0.11636', '0.46']
        - ['(1,2)', '0.83636', '0.46']
    body_box: [0.244, 3.5, 12.85, 1.7]
    size: 20
    body:
      - '**Questions:** Can any two weights fit this policy''s values exactly? What feature would let the two aliased cells differ? Does the answer necessarily stay the same if the policy changes?'
    blocks:
      - box: [0.244, 5.1, 12.85, 1.8]
        size: 19
        items:
          - 'No exact fit for this policy: the last two values must be equal in our model. A constant, a top-row indicator and a right-column indicator distinguish the three nonterminal states.'
          - '**Some value functions cannot be represented; whether this policy''s can depends on the policy.**'
    reveal: ['yaml:blocks.0']
    minutes: 6
    sources: ['check_function_approximation_claude.py §§1, 3 (exact values)', 'book §9.5']
    notes: |
