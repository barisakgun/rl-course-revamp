    after_box: [0.244, 2.75, 12.85, 4.2]
    after:
      - text: 'Observed transition: **(1,1), right, −0.04, (1,2)**. The next epsilon-greedy action is **up**.'
      - text: '1. Calculate each target and the updated entry for SARSA and Q-learning.'
      - text: '2. Which next action does each target use?'
      - text: '3. When can the two targets agree?'
      - text: '**Separate terminal case — reset the exercise:** (1,2), right, +1, goal. What is each target?'
    minutes: 7
    sources: ['old Model-Free Control PPTX 21 and 40 (target forms), accepted exercise (D5), review R14']
    notes: |
      Two minutes to identify the entries, five for students to compute and explain. Both methods start from the
      same snapshot; never apply the second method to the first method's updated entry. The right action at (1,1)
      can reach (1,2) by a perpendicular slip, so the observed transition is valid. The terminal case is an
      independent transition, not the next step after selecting up. Keep the answer hidden until C15a.
      Source: accepted exercise; R14.

  - id: C15a
    kind: math
    title: Compare the updates
    table_box: [0.244, 1.1, 12.85]
    table:
      size: 19
      row_h: 0.62
      align_left: true
      widths: [3.0, 4.9, 4.95]
      header: ['', 'SARSA', 'Q-learning']
      rows:
        - ['Continuation', '$Q((1,2),\text{up})=0.2$', '$\max Q((1,2),\cdot)=0.8$']
        - ['$U_t$', '−0.04 + 0.5 × 0.2 = **0.06**', '−0.04 + 0.5 × 0.8 = **0.36**']
        - ['Updated $Q((1,1),\text{right})$', '0.1 + 0.5(0.06 − 0.1) = **0.08**', '0.1 + 0.5(0.36 − 0.1) = **0.23**']
    after_box: [0.244, 4.0, 12.85]
    after:
      - text: '**Same snapshot, same observed reward and next state; different continuation.**'
      - text: 'Separate goal transition: **both targets are 1**, with zero continuation.'
    minutes: 3
    sources: ['native target/update forms (old PPTX 21/40 purpose), numbers checked in scripts/check_control_claude.py']
    notes: |
      Ask for the reasoning, not just the arithmetic. On this nonterminal example, the targets agree if the
      sampled next action has the maximum Q value, including a tie. In general γ = 0 also removes the continuation
      difference. A coinciding target does not make whole learning trajectories identical: action ordering and
      later estimates still matter, especially on self-transitions. The terminal target is 1, not the previous
      table's goal estimate or a bootstrapped extra reward.

  - id: C16
    kind: math
    title: What is each update trying to learn?
    table_box: [0.244, 1.1, 12.85]
    table:
      size: 17
      row_h: 0.62
      align_left: true
      widths: [2.0, 3.9, 2.9, 4.05]
      header: ['Method', 'Update target', 'Continuation represented', 'DP connection']
      rows:
        - ['MC control', '$G_t$', 'episode''s collecting policy', 'evaluation/improvement idea; complete return']
        - ['SARSA', '$R_{t+1}+\gamma Q(S_{t+1},A_{t+1})$', 'behaviour policy', 'sampled action-value evaluation plus improvement']
        - ['Q-learning', '$R_{t+1}+\gamma\max_a Q(S_{t+1},a)$', 'greedy continuation', 'sampled optimality backup']
    after_box: [0.244, 4.2, 12.85]
    after:
      - text: '**SARSA estimates action values for the policy it follows. Q-learning aims at optimal action values while exploring.**'
    minutes: 3.5
    sources: ['old Model-Free Control PPTX 50–51 (comparison purpose; Silver images replaced by one native table), book §§5.4/6.4/6.5, review R15–R16']
    notes: |
      Two minutes read the contrasts, 1.5 minutes interpret. All rows use the common update form, but targets are
      not the only difference: MC waits for the episode and uses its declared visit/averaging convention. With
      control, policies and estimates change together. The DP column is a conceptual connection, not an
      equivalence of update schedules or an extra algorithm. MC's full-return target has no one-step DP
      counterpart. Terminal continuation is zero in the TD rows.

      Reference numbers (notes only): for the accepted grid and fixed epsilon-greedy policy around up/up/right
      with ε = 0.1, q^π at the greedy pairs is 0.341369, 0.849121, 0.849121 in state order (1,1), (2,1), (1,2);
      q^* at those same pairs is 0.361818, 0.852727, 0.852727. These are model-computed reference values, not a
      learning experiment. The values 0.331793/0.810622/0.810622 instead average over the first action and are
      v^π, so do not label them Q. The two reference policies have the same greedy actions; finite learning need
      not produce identical behaviour. No guarantee for constant α follows. Sources: book §§5.4/6.4/6.5; R15–R16.

