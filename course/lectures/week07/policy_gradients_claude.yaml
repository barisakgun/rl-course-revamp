        header: ['$t$', 'Action', '$R_{t+1}$', 'Which rewards enter $G_t$?', 'Score sign', 'Weighted contribution']
        rows:
          - ['0', 'Right', '2', '', '', '']
          - ['1', 'Left', '2', '', '', '']
      - box: [0.5, 5.0, 12.3]
        size: 18
        row_h: 0.5
        widths: [0.6, 1.4, 1.4, 4.0, 2.0, 2.9]
        header: ['$t$', 'Action', '$R_{t+1}$', 'Which rewards enter $G_t$?', 'Score sign', 'Weighted contribution']
        rows:
          - ['0', 'Right', '2', 'First and second', '+', '']
          - ['1', 'Left', '2', 'Second', '−', '']
    reveal: ['yaml:tables.1']
    minutes: 4
    sources: ['constructed (check_policy_gradients_claude.py §9)', 'accepted worked activity: finish the sampled example in 7.2']
    notes: |
      D08. Students fill the reward membership and score signs. Reveal those two columns before the break. Keep the weighted
      contributions for B01, which reuses the same tree and table. Filled dots are terminal.
