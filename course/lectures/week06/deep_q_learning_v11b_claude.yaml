# Status: decisions/lectures/deep_q_learning.md. Numbers: scripts/check_deep_q_learning_claude.py §1 and §10.
#
# Build:  python3 scripts/build_deck_claude.py course/lectures/week06/deep_q_learning_v11b_claude.yaml
