deck:
  template: course/templates/lecture_template_claude.pptx
  output: course/lectures/week06/deep_q_learning_v11b_claude.pptx
  preview: output/lectures/week06/deep_q_learning_v11b_claude_preview.png
  session_id: dqn_loop
  qa_minutes: 0
  timed_alternates: {'worked example': B}
  title: Deep Q-learning (V11-B revision)
  author: Barış Akgün
  term: Fall 2026

slides:
  - id: V11-B
    kind: math
    alt: {choice: 'worked example', option: B}
    title: 'Why did the prediction rise?'
    body_box: [0.244, 1.0, 12.85, 2.15]
    size: 20
    body:
      - {text: 'Both heads take one step on the minibatch mean: $\alpha=0.3$, divided by the 3 rows.'}
      - {text: 'Left head, used only by row 1:'}
      - {eq: '(0.1,0.1)+\frac{0.3}{3}[−0.2(1,2)]=(0.08,0.06)'}
      - {text: '**Compute** the right-head step from $(0,0.2)$. Rows 2 and 3 (both R) use it.'}
    blocks:
      - box: [0.244, 3.2, 12.85, 1.2]
        size: 20
        items:
          - {eq: '(0,0.2)+\frac{0.3}{3}[−0.2(1,2)+0.4(1,3)]=(0.02,0.28)'}
          - {text: 'At position 2 the R prediction goes **0.40 → 0.58**.'}
      - box: [0.244, 4.45, 12.85, 0.8]
        size: 20
        items:
          - {text: 'Row 2''s label (0.20) is below its prediction (0.40), so row 2 alone would lower this prediction. **Why did it rise?**'}
      - box: [0.244, 5.3, 12.85, 0.8]
        size: 20
        items:
          - {text: 'Rows 2 and 3 share the right-head weights. At position 2, row 2''s part of the step gives −0.10 and row 3''s gives +0.28.'}
      - box: [0.244, 6.15, 12.85, 0.95]
        size: 20
        items:
          - {text: 'Row 2''s label: from $\mathbf{w}^-$ it stays 0.20 through the step. From the online weights it would move 0.30 → 0.43. After the copy it becomes 0.43.'}
    reveal: ['yaml:blocks.0', 'yaml:blocks.1', 'yaml:blocks.2', 'yaml:blocks.3']
    minutes: 6
    sources: ['Claude proposal A13 (shortened, review R02)', 'instructor editing round 1 (2026-11-17): alpha for both heads, why the question arises', 'check_deep_q_learning_claude.py §1 and §10']
    notes: |
      V11-B · Alt B. The left-head line is the worked model: one step on the minibatch mean, so α = 0.3 is divided by
      all 3 rows even though only row 1 uses the left head. Rows 2 and 3 give the left head a zero gradient but still
      count in the mean; students often divide by 1 here. Students then compute the right head in the same form.
      Reveal order: the step and the new prediction; why it is surprising (row 2's TD error is −0.20, so on its own
      its gradient lowers the R prediction at position 2); the answer; the label before and after the copy.
      Answer to "why": the goal transition (error +0.40, features (1, 3)) pulls on the same right-head weights as
      row 2 (error −0.20, features (1, 2)) and outvotes it. At position 2: row 2's part is 0.1 × (−0.2) × (1·1 + 2·2)
      = −0.10; row 3's part is 0.1 × 0.4 × (1·1 + 3·2) = +0.28; net +0.18. Position 1's R output also moved
      (0.20 → 0.30) without being in the minibatch. At position 3 the online maximum goes 0.60 → 0.86.
      q* for R is (0.25, 0.5, 1), which this model cannot represent exactly; the trace shows mechanics, not
      convergence. Week 5 F12a showed the same pull of two samples on shared weights.
      The next slide (study at home, untimed) updates once per transition on rows 2 and 3.
      Only one worked-example route counts toward the targets.

  - id: V11-B-home
    kind: math
    appendix: true
    title: 'At home: one update per transition'
    body_box: [0.244, 1.0, 12.85, 1.7]
    size: 18
    body:
      - {text: 'Rows 2 and 3 are the agent''s last two transitions: 2 → 3, then 3 → goal.'}
      - {text: '**Question:** instead of one minibatch step, update after each transition, in that order, with $\alpha=0.1$ per update (the minibatch''s 0.3/3 per row). The labels stay 0.20 and 1.00 (from $\mathbf{w}^-$). How do the right-head weights evolve?'}
    table_box: [0.244, 2.75, 12.85]
    table:
      size: 18
      row_h: 0.5
      widths: [3.4, 2.2, 2.85, 2.2, 2.2]
      header: ['After', 'TD error', 'Right-head weights', 'R at position 2', 'R at position 3']
      rows:
        - ['start', '—', '(0, 0.2)', '0.40', '0.60']
        - ['row 2 (2, R, 0, 3)', '−0.20', '(−0.02, 0.16)', '0.30', '0.46']
        - ['row 3 (3, R, +1, goal)', '+0.54', '(0.034, 0.322)', '0.678', '1.00']
        - ['one minibatch step', '−0.20 and +0.40', '(0.02, 0.28)', '0.58', '0.86']
    after_box: [0.244, 5.4, 12.85, 1.7]
    after:
      - {text: '**Question:** a replay draw could give the other order. Repeat with row 3 first.'}
      - {text: 'Row 3: error +0.40, weights (0.04, 0.32). Row 2: error −0.48, weights (−0.008, 0.224). R at position 2 ends at 0.44.'}
      - {text: 'Each update uses the TD error at the current weights, so the order changes the result. The minibatch step computes every error at the same weights.'}
    minutes: 0
    sources: ['instructor, 2026-11-17 (editing round 1): study slide after V11-B', 'check_deep_q_learning_claude.py §10']
    notes: |
      V11-B-home · Study at home; not covered in class and outside the session timing. Restricted to rows 2 and 3,
      the agent's last two transitions, so the comparison is with updating after each transition as it happened
      (instructor, 2026-11-17). Both routes start from the same online weights and use the same fixed labels from
      w⁻; only the update rule differs. The left head is not involved (row 1 is not used here).
      α = 0.1 per update gives each row the same weight as the minibatch step's 0.3/3, so the comparison is fair.
      In order 2, 3 the R prediction at position 2 first falls (0.40 → 0.30) and then rises to 0.678; in order 3, 2
      it ends at 0.44; the minibatch step gives 0.58, between the two.
      With α = 0.1 and features (1, 3), α‖x‖² = 1, so row 3's update lands exactly on its label (R at position 3
      becomes 1.00 in both orders); with features (1, 2), α‖x‖² = 0.5, so row 2's update goes halfway.
      With α = 0.3 per update (three times the per-row weight) order 2, 3 overshoots: R at position 2 ends at 1.82,
      above both labels. This is a step-size effect, not part of this slide's point.
