  - id: V11-B
    kind: math
    alt: {choice: 'worked example', option: B}
    title: 'Alt B · Why did the prediction rise?'
    body_box: [0.244, 1.1, 12.85, 1.8]
    size: 22
    body:
      - {text: 'Left head (given): $(0.10,0.10)\rightarrow(0.08,0.06)$. Right head starts at $(0,0.2)$.'}
      - {text: '**Compute** the right-head step: $\alpha=0.3$, mean over the three rows.'}
    blocks:
      - box: [0.244, 2.9, 12.85, 1.0]
        size: 22
        items:
          - {eq: '(0,0.2)+\frac{0.3}{3}[-0.2(1,2)+0.4(1,3)]=(0.02,0.28)'}
      - box: [0.244, 4.0, 12.85, 1.2]
        size: 22
        items:
          - {text: 'At position 2 the R prediction goes **0.40 → 0.58**, although its TD error was −0.20. **Why?**'}
      - box: [0.244, 5.2, 12.85, 1.6]
        size: 22
        items:
          - {text: 'Row 2''s label: from $\mathbf{w}^-$ it stays 0.20 through the step. From the online weights it would move 0.30 → 0.43. After the copy it becomes 0.43.'}
    reveal: ['yaml:blocks.0', 'yaml:blocks.1', 'yaml:blocks.2']
    minutes: 6
    sources: ['Claude proposal A13 (shortened, review R02)', 'check_deep_q_learning_claude.py §1']
    notes: |
      V11-B · Alt B. Answer to "why": the goal transition (error +0.40, features (1, 3)) pulls on the same right-head
      weights as row two (error −0.20, features (1, 2)) and outvotes it. Position 1's R output also moved
      (0.20 → 0.30) without being in the minibatch. At position 3 the online maximum goes 0.60 → 0.86.
      q* for R is (0.25, 0.5, 1), which this model cannot represent exactly; the trace shows mechanics, not
      convergence. Week 5 F12a showed the same pull of two samples on shared weights.
      Only one worked-example route counts toward the targets.

  - id: V12
    kind: math
    title: Settings for a DQN learner
    body_box: [0.244, 1.1, 12.85, 4.0]
    size: 22
    body:
      - '**Data:** exploration schedule, warm-up, buffer size, minibatch size.'
      - '**Updates:** step size, clipping, target-copy period $C$.'
      - 'Soft-update alternative: move the target weights a fraction $\tau$ toward the online weights after every update.'
      - {eq: '\mathbf{w}^-\leftarrow\tau\mathbf{w}+(1-\tau)\mathbf{w}^-'}
    minutes: 1
    sources: ['old Deep QL PPTX 22 (tuning list) and 14 (Polyak averaging), deep_q_learning D6', 'book pp. 439–440', 'CS285 L8 pp. 19–20']
    notes: |
      V12 (D6). One minute: a list to recognise, not to memorise. This lecture uses hard copies every C updates and
      the mean half-squared loss. A2's settings belong to its handout. τ is the Polyak rate (D9); it is small, e.g.
      0.005. Old P14 wrote the rate the other way round (w′ ← τw′ + (1 − τ)w with τ near 1); the slide follows the
      common convention. Old P14's "init: random or all zeros" is not reused: all-zero network weights keep hidden
      units identical. Settings in Mnih et al. 2015 (Extended Data Table 1): minibatch 32; replay memory of the 1,000,000
      most recent frames; C = 10,000 parameter updates; 50,000 frames of a uniform random policy before learning; ε
      annealed linearly from 1 to 0.1 over the first 1,000,000 frames; RMSProp with learning rate 0.00025; γ = 0.99.

