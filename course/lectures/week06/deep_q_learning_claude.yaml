    notes: |
      V00a (instructor, 2026-11-16, D13). The highlighted cell is Week 5's bottom-right ✗: Q-learning with a nonlinear
      approximator can diverge. DQN is exactly that combination. Ask the question, then reveal the mechanisms, listed
      in the same order as the wishes: the network gives richer values; replay gives reusable, mixed experience; the
      target copy gives targets that stay still between copies.
      None of the three restores a convergence guarantee; the ✗ still describes DQN. They change what the learner is
