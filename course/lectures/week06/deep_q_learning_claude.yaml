  - id: V01
    kind: math
    title: From frames to action values
    pictures:
      - {deck: 'sources/current_course/8 - Deep QL.pptx', slide: 15, shape: 'Picture 4', box: [6.1, 1.15, 7.0]}
      - {deck: 'sources/current_course/8 - Deep QL.pptx', slide: 3, shape: 'Picture 3', box: [0.5, 3.75, 3.4], crop: [0.36, 0, 0, 0]}
    body_box: [0.244, 1.1, 5.7, 2.6]
    size: 22
    body:
      - 'Input: the last four frames'
      - 'Output: one value per joystick action'
      - 'Reward: change in game score'
      - {text: '**Question:** which way is the ball moving?'}
    blocks:
      - box: [4.1, 4.3, 1.9, 2.0]
        size: 16
        items:
          - {text: 'One frame shows where the ball is; four frames show where it is going.'}
    after_box: [6.1, 5.6, 7.0, 1.2]
    after:
      - {text: 'Same architecture and training procedure, trained separately on each of 49 games. More than 75% of the human score on 29.'}
    reveal: ['yaml:blocks.0']
    minutes: 4
    sources: ['old Deep QL PPTX 15 (Atari network picture), 3 (one-output-per-action panel, cropped)', 'Mnih et al. 2015, Fig. 3 and Extended Data Table 2 (https://doi.org/10.1038/nature14236)', 'book §16.5 printed 436–441 / PDF 458–463']
    notes: |
      V01. Ask "Which way is the ball moving?" while pointing at a single frame; reveal the frame-history answer.
      Then point to the network's output: one estimated return per joystick action, so one forward pass gives every
      action's value (the left panel shows the same form). Have students point to the score used to act (the largest
      output) and the score fitted after observing a transition (the output for the recorded action, V02).
      Caption details: random play anchors 0% and the professional human tester 100% on each game's scale; "more
      than 75% of the human score on more than half of the games (29 games)" is the paper's statement for 49 games
      (D11; the book's "29 of the 46" is not used). Rewards were clipped for training in this study. Frame history
      supplies motion information but does not remove partial observability in every game (book p. 438). Results
      are from 2015; no present-day comparison is implied.

  - id: V02
    kind: math
    title: Train the output for the action taken
    body_box: [0.244, 1.1, 12.85, 3.6]
    size: 24
    body:
      - {text: 'Nonterminal transition:'}
      - {eq: 'U_t=R_{t+1}+\gamma\max_a\hat{q}(S_{t+1},a,\mathbf{w})'}
      - {eq: '\mathbf{w}\leftarrow\mathbf{w}+\alpha[U_t-\hat{q}(S_t,A_t,\mathbf{w})]\nabla\hat{q}(S_t,A_t,\mathbf{w})'}
      - {text: 'Terminal transition: $U_t=R_{t+1}$'}
    blocks:
      - box: [0.244, 4.9, 12.85, 0.8]
        size: 24
        items:
          - {text: '**Question:** which output receives the error?'}
      - box: [0.244, 5.7, 12.85, 1.2]
        size: 22
        items:
          - {text: 'Only the output for the recorded action $A_t$. Its weights are shared with every other output and state.'}
    reveal: ['yaml:blocks.1']
    minutes: 4
    sources: ['old Deep QL PPTX 4–5 (approximate Q-learning loop and "treat the target as a constant", regenerated in course notation)', 'Week 5 F15', 'book eq. 16.3 p. 439']
    notes: |
      V02. This is Week 5's approximate Q-learning update with a network. Mark the recorded action at the current
      state (it receives the gradient) and the greedy action at the successor (it supplies the bootstrap). Draw the
      network twice with the same weights and ask which prediction is differentiated. Backpropagate from the
      recorded action's current prediction; the label is held fixed during differentiation (semi-gradient, Week 5 F08).
      An update to shared weights can change a successor prediction used in the next label: keep this question open
      for V06.

  - id: V03-A
    kind: math
    alt: {choice: 'replay motivation', option: A}
    title: 'Alt A · Replay motivation: consecutive frames'
    drawing:
      - {outline: [0.5, 1.2, 2.8, 2.2]}
      - {box: [0.65, 1.35, 2.5, 0.3], text: '', tint: true}
      - {box: [1.5, 3.1, 0.8, 0.12], text: ''}
      - {circle: [1.4, 2.7, 0.18], filled: true}
      - {label: 't', box: [0.5, 3.5, 2.8, 0.4], size: 18}
      - {outline: [3.6, 1.2, 2.8, 2.2]}
      - {box: [3.75, 1.35, 2.5, 0.3], text: '', tint: true}
      - {box: [4.6, 3.1, 0.8, 0.12], text: ''}
      - {circle: [4.65, 2.5, 0.18], filled: true}
      - {label: 't+1', box: [3.6, 3.5, 2.8, 0.4], size: 18}
      - {outline: [6.7, 1.2, 2.8, 2.2]}
      - {box: [6.85, 1.35, 2.5, 0.3], text: '', tint: true}
      - {box: [7.7, 3.1, 0.8, 0.12], text: ''}
      - {circle: [7.9, 2.3, 0.18], filled: true}
      - {label: 't+2', box: [6.7, 3.5, 2.8, 0.4], size: 18}
      - {outline: [10.0, 1.2, 2.8, 2.2]}
      - {box: [10.15, 1.35, 2.5, 0.3], text: '', tint: true}
      - {box: [10.6, 3.1, 0.8, 0.12], text: ''}
      - {circle: [12.3, 1.9, 0.18], filled: true}
      - {label: 'much later', box: [10.0, 3.5, 2.8, 0.4], size: 18}
    body_box: [0.244, 4.1, 12.85, 1.6]
    size: 22
    body:
      - 'Which region of the screen dominates three successive updates?'
      - 'Which regions could appear together in a minibatch drawn from memory?'
    blocks:
      - box: [0.244, 5.8, 12.85, 1.0]
        size: 22
        items:
          - {text: 'A minibatch drawn from stored experience can hold $t+1$ and "much later" together.'}
    reveal: ['yaml:blocks.0']
    minutes: 3
    sources: ['schematic frames drawn natively (content V03-A)', 'old Deep QL PPTX 3–4 ("states are correlated")', 'Silver L6 pp. 36–38']
    notes: |
      V03-A · Alt A, replay motivation (D4). Three successive frames: same bricks and paddle, the ball one position
      further up and right each time; the last frame is from much later, with the ball across the screen. Online
      learning updates on t, t+1, t+2 in a row, all from one region; a batch from memory can mix regions.
      Distinguish sample mixing (this slide) from reuse (V04). Keep V02's question about the moving target for V06.
      Only one replay alternative counts toward the targets.

  - id: V03-B
    kind: math
    alt: {choice: 'replay motivation', option: B}
    title: 'Alt B · Replay motivation: same eight examples, different order'
    body_box: [0.244, 1.1, 12.85, 1.6]
    size: 22
    body:
      - 'One shared prediction, initially 0. Targets: A = +1, B = −1.'
      - 'Each update moves halfway to the mean target of its pair. Which way does the prediction move?'
    tables:
      - box: [0.8, 2.9, 11.7]
        size: 20
        row_h: 0.6
        widths: [3.5, 2, 2, 2, 2]
        header: ['Pair order', 'After 1', 'After 2', 'After 3', 'After 4']
        rows:
          - ['AA, AA, BB, BB', '', '', '', '']
          - ['AB, AB, AB, AB', '', '', '', '']
      - box: [0.8, 2.9, 11.7]
        size: 20
        row_h: 0.6
        widths: [3.5, 2, 2, 2, 2]
        header: ['Pair order', 'After 1', 'After 2', 'After 3', 'After 4']
        rows:
          - ['AA, AA, BB, BB', '0.5', '0.75', '−0.125', '−0.5625']
          - ['AB, AB, AB, AB', '0', '0', '0', '0']
    blocks:
      - box: [0.244, 5.0, 12.85, 1.4]
        size: 22
        items:
          - {text: 'Grouped data drags the shared prediction toward whatever came last; mixed pairs keep it at the best single value, 0.'}
    reveal: [['yaml:tables.1', 'yaml:blocks.0']]
    minutes: 3
    sources: ['review R01 (controlled comparison)', 'check_deep_q_learning_claude.py §3', 'old Deep QL PPTX 3–4']
    notes: |
      V03-B · Alt B, replay motivation (D4). Reveal the batch order, ask for the direction of movement, then reveal
      the values. Both conditions use the same eight examples, the same batch size (two), the same number of
      optimizer steps (four) and the same step size (0.5); only the grouping differs. AB is deliberately balanced:
      a uniform replay draw can also give AA or BB, so replay reduces grouping on average rather than guaranteeing
      balance. This is a supervised illustration of the effect of grouping, not an RL run. Sample reuse is a separate
      benefit, shown on V04. Only one replay alternative counts toward the targets.

  - id: V04
    kind: math
    title: Draw training examples from replay
    pictures:
      - {deck: 'sources/current_course/8 - Deep QL.pptx', slide: 10, shape: 'Picture 4', box: [0.8, 1.05, 9.4]}
    drawing:
      - {label: 'Figure: S. Levine, CS285', box: [10.3, 3.1, 2.8, 0.4], size: 12, center: false}
    body_box: [0.244, 3.75, 12.85, 2.0]
    size: 22
    body:
      - 'Store each transition and its terminal flag in a bounded buffer $\mathcal{D}$; when full, drop the oldest.'
      - 'After a warm-up, sample a minibatch uniformly from $\mathcal{D}$ for every update.'
      - {text: '**Question:** a stored row is drawn into two different updates. How many environment steps produced it?'}
    blocks:
      - box: [0.244, 5.9, 12.85, 0.9]
        size: 22
        items:
          - {text: 'One. Replay reuses each interaction for several updates.'}
    reveal: ['yaml:blocks.0']
    minutes: 4
    sources: ['old Deep QL PPTX 9–10 (steps and buffer picture, Levine)', 'old Value Function Approximation PPTX 57 (incremental versus batch)', 'book §16.5 p. 440', 'Silver L6 p. 38']
    notes: |
      V04. Draw one old and one recent row into a minibatch. VFA P57's distinction: incremental methods use each
      transition once; batch methods store everything and refit; replay sits between, with a bounded buffer.
      Distinguish reuse from increasing optimizer steps per interaction: replay lets the learner take more updates per
      environment step, which changes compute, not the amount of experience. Random sampling reduces temporal
      clustering in each minibatch while keeping the buffer's coverage; it does not make the stored data independent
      of the behaviour that generated it (old P10's "samples are no longer correlated" is corrected to this).

  - id: V05
    kind: math
    title: Why an old action supplies a Q-learning update
    body_box: [0.244, 1.1, 12.85, 2.4]
    size: 22
    body:
      - {text: 'A stored transition $(s,a,r,s'')$, collected by an earlier $\epsilon$-greedy policy.'}
      - 'Which action was recorded?'
      - 'Where does the successor value come from?'
      - 'What else would a sampled Sarsa target need?'
    blocks:
      - box: [0.244, 3.8, 12.85, 2.6]
        size: 22
        items:
          - {text: 'Q-learning target: $r+\gamma\max_a\hat{q}(s'',a,\mathbf{w})$. It needs only $(s,a,r,s'')$; the max supplies the next action.'}
          - {text: 'Sarsa needs the next action, which the old behaviour policy chose then.'}
    reveal: ['yaml:blocks.0']
    minutes: 3
    sources: ['Week 4 C13 (behaviour and target policies)', 'book §16.5 p. 438 (replay requires an off-policy method)', 'CS234 A2 written question on replay']
    notes: |
      V05. With unchanged dynamics, the reward and successor are a sample conditional on the recorded state and
      action, whoever chose the action. Q-learning builds its greedy bootstrap from successor values. A stored Sarsa
      successor action came from the behaviour policy that acted then, so a Sarsa target from the buffer would
      evaluate that old policy. The buffer mixes many earlier behaviour policies.
      Replay does not make the data on-policy: updates follow the buffer's mix of states, which is Week 5's "other
      state weighting" row, so the off-policy ingredient of the deadly triad is still present. No importance ratio is
      used (Week 8). Expected Sarsa could recompute its expectation under the current policy (exposure only).

  - id: V06
    kind: math
    title: Freeze the label for five updates
    body_box: [0.244, 1.1, 12.85, 1.6]
    size: 22
    body:
      - {text: 'Week 5: $\hat{v}(L,w)=w$, $\hat{v}(R,w)=2w$, reward 0, $\gamma=0.9$, $\alpha=0.1$, start at $w=10$. Replay the same transition five times.'}
      - {text: 'Label from current weights: $1.8w$. Label from a snapshot: 18 until the copy.'}
    tables:
      - box: [0.5, 2.9, 12.3]
        size: 20
        row_h: 0.6
        widths: [5.1, 1.8, 1.8, 1.8, 1.8]
        header: ['Weight after update', 'Start', '1', '2', '5']
        rows:
          - ['Recompute the label each step', '10', '10.8', '', '']
          - ['Hold the label at 18 for five updates', '10', '10.8', '', '']
      - box: [0.5, 2.9, 12.3]
        size: 20
        row_h: 0.6
        widths: [5.1, 1.8, 1.8, 1.8, 1.8]
        header: ['Weight after update', 'Start', '1', '2', '5']
        rows:
          - ['Recompute the label each step', '10', '10.8', '11.664', '14.693']
          - ['Hold the label at 18 for five updates', '10', '10.8', '11.52', '13.276']
    blocks:
      - box: [0.244, 5.0, 12.85, 0.8]
        size: 22
        items:
          - {text: '**Question:** what is $w$ after update 2 in each row?'}
      - box: [0.244, 5.8, 12.85, 1.0]
        size: 22
        items:
          - {text: 'After update 5, copy the weight. The next label is 23.90.'}
    reveal: ['yaml:tables.1', 'yaml:blocks.1']
    minutes: 5
    sources: ['Week 5 I02 (two-state fragment)', 'deep_q_learning D3, review C02', 'check_deep_q_learning_claude.py §2', 'old Deep QL PPTX 11 (target function)', 'CS285 L8 pp. 4–7']
    notes: |
      V06 (D3). Ask for update 2, then reveal both rows and the copy. Within the frozen block the update is
      w ← w + 0.1(18 − w); recomputing the label gives w ← w + 0.1(1.8w − w) = 1.08w.
      Ask CS285's two questions: why is this good (between copies the problem is ordinary regression on fixed labels),
      why is it bad (labels are up to C updates out of date, so new information spreads more slowly).
      Holding a label fixed in one derivative (V02) and freezing its generating weights across optimizer steps (here)
      are distinct operations. Growth continues across copies in this experiment (×1.33 per five-update period against
      ×1.47 for five recomputed labels): freezing slows the feedback; it does not remove it or guarantee convergence.
      These numbers apply to repeated updates on one row of the Week 5 construction.

  - id: V07
    kind: math
    title: Construct the target and fit the minibatch
    body_box: [0.244, 1.1, 12.85, 4.2]
    size: 22
    body:
      - {text: 'Each sampled $(s_j,a_j,r_j,s''_j)$ carries its terminal flag.'}
      - {text: 'Terminal: $U_j=r_j$.   Otherwise:'}
      - {eq: 'U_j=r_j+\gamma\max_a\hat{q}(s''_j,a,\mathbf{w}^-)'}
      - {eq: 'L(\mathbf{w})=\text{mean}_j\ \frac{1}{2}[U_j-\hat{q}(s_j,a_j,\mathbf{w})]^2'}
    blocks:
      - box: [0.244, 5.3, 12.85, 0.7]
        size: 22
        items:
          - {text: '**Question:** which weights does the optimizer change?'}
      - box: [0.244, 6.0, 12.85, 0.9]
        size: 22
        items:
          - {text: 'Only $\mathbf{w}$. $\mathbf{w}^-$ changes only when it is copied.'}
    reveal: ['yaml:blocks.1']
    minutes: 4
    sources: ['old Deep QL PPTX 11 and 13 (target function; minibatch update, sum replaced by mean)', 'CS234 L4 p. 67 (terminal case)', 'Silver L6 p. 38 (loss)']
    notes: |
      V07. Targets are detached: U_j is computed without gradient tracking. One gradient step on L with U_j held
      constant is Week 5's update averaged over the minibatch; only the output for the recorded action a_j has an
      error. A delayed snapshot can lag behind new information.
      A second copy of the Q-network's parameters supplies the target predictions with no second backward pass.
      The terminal flag means true termination. At an external time limit on a continuing task, bootstrap from the
      final observation before the reset: a time-out is not a terminal state.
      Notation (D9): (s_j, a_j, r_j, s′_j) is the j-th sampled transition; L(w) is the minibatch loss.

  - id: V08
    kind: math
    title: The DQN loop
    body_box: [0.244, 1.1, 12.85, 5.0]
    size: 22
    body:
      - {text: '1. Initialize $\mathbf{w}$. Copy $\mathbf{w}^-\leftarrow\mathbf{w}$. Start with an empty buffer $\mathcal{D}$.'}
      - {text: '2. Act $\epsilon$-greedily with the online network. Store the transition and its terminal flag; advance or reset the episode.'}
      - {text: '3. After warm-up, draw a uniform minibatch. Targets from $\mathbf{w}^-$; predictions at the recorded actions.'}
      - {text: '4. One optimizer step on the mean loss, with respect to $\mathbf{w}$.'}
      - {text: '5. After every $C$ learner updates, copy $\mathbf{w}^-\leftarrow\mathbf{w}$. Continue collecting.'}
    after_box: [0.244, 6.1, 12.85, 0.8]
    after:
      - {text: '**Three clocks:** environment steps, optimizer steps, target copies.'}
    minutes: 4
    sources: ['old Deep QL PPTX 12 (rebuilt: initial copy, terminal flag, one batch-mean step, C replaces N)', 'CS234 L4 p. 67', 'CS285 L8 pp. 8, 10–12', 'Abbeel L2 pp. 33–34', 'book §16.5']
    notes: |
      V08. Ask what changes during warm-up (only the buffer), during an ordinary update (w and the buffer), and on the
      update that triggers a copy (w, the buffer, then w⁻). The copy comes after the optimizer step. Old P12's inner
      per-row loop is replaced by one batch-mean step; the circular buffer evicts the oldest transitions (old P12's
      "indirect point"). Keep this slide's loop for 6.2.

  - id: V09-A
    kind: math
    alt: {choice: 'worked example', option: A}
    title: 'Alt A · Act, append, sample'
    body_box: [0.244, 1.05, 12.85, 1.5]
    size: 20
    body:
      - {text: 'Two actions, L and R. All rewards lie in $[-1,+1]$; $\gamma=0.5$. Features and head weights are frozen: only each output''s bias is trainable.'}
      - {text: 'Behaviour takes R, receives −1, and the episode ends. Which rows reach the minibatch?'}
    drawing:
      - {box: [0.8, 2.7, 3.6, 0.7], text: 'older, nonterminal'}
      - {box: [4.85, 2.7, 3.6, 0.7], text: 'intervening'}
      - {box: [8.9, 2.7, 3.6, 0.7], text: 'newest, terminal'}
      - {outline: [0.7, 2.6, 3.8, 0.9]}
      - {outline: [8.8, 2.6, 3.8, 0.9]}
    tables:
      - box: [0.244, 3.8, 12.85]
        size: 18
        row_h: 0.6
        widths: [2.6, 1.8, 1.3, 2.4, 2.3, 2.3]
        header: ['Drawn row', 'Recorded action', 'Reward', 'Online at recorded action', 'Online at successor (L, R)', 'Target at successor (L, R)']
        rows:
          - ['Older, nonterminal', 'L', '+1', '2', '(4, 2)', '(2, 6)']
          - ['Newest, terminal', 'R', '−1', '0', '—', '—']
    reveal: [['draw:3:outline', 'draw:4:outline', 'yaml:tables.0']]
    minutes: 4
    sources: ['ChatGPT proposal slides 7–9 (two-row trace)', 'deep_q_learning D2 Alt A, review C01 and C06', 'check_deep_q_learning_claude.py §9']
    notes: |
      V09-A · Alt A, worked example (D2). Show the three buffer cards; reveal the uniform draw of the first and
      third with the table. Successor outputs are ordered (L, R). These are supplied predictions.
      Reward magnitude ≤ 1 with γ = 0.5 gives discounted returns of magnitude ≤ 2, so the target network's 6 (and the
      online 4) are impossible values: keep that as a question for 6.2 (D02). One large prediction alone cannot
      establish statistical bias; that needs repeated estimates (D03).
      Only one worked-example route counts toward the targets.

