    reveal: [['yaml:tables.1', 'yaml:blocks.1']]
    minutes: 6
    sources: ['ChatGPT proposal slides 8–9', 'check_deep_q_learning_claude.py §9']
    notes: |
      V10-A · Alt A. Row one uses the target network's maximum at the successor, 1 + 0.5 × 6 = 4. Row two is terminal:
      the reward alone, −1, with no next-action lookup. Errors +2 and −1; loss (4 + 1)/4 = 1.25.
      Only one worked-example route counts toward the targets.

  - id: V11-A
    kind: math
    alt: {choice: 'worked example', option: A}
    title: 'Alt A · Follow the change to the successor'
    body_box: [0.244, 1.1, 12.85, 1.2]
    size: 22
    body:
      - {text: 'Plain SGD, step size 0.1, mean over the two rows. Which predictions at other states move?'}
    blocks:
      - box: [0.244, 2.4, 12.85, 0.9]
        size: 22
        items:
          - {text: '1. Bias of L: +0.10. Bias of R: −0.05.'}
      - box: [0.244, 3.3, 12.85, 1.4]
        size: 22
        items:
          - {text: '2. At the successor, online outputs move (4, 2) → (4.1, 1.95). A label from the online weights would move 3 → 3.05.'}
      - box: [0.244, 4.7, 12.85, 1.4]
        size: 22
        items:
          - {text: '3. The target-network label stays **4** through the step. After the copy $\mathbf{w}^-\leftarrow\mathbf{w}$: 1 + 0.5 × 4.1 = **3.05**.'}
    reveal: ['yaml:blocks.0', 'yaml:blocks.1', 'yaml:blocks.2']
    minutes: 6
    sources: ['ChatGPT proposal slide 9 with review C01 (declared bias-only model, three reveals)', 'check_deep_q_learning_claude.py §9']
    notes: |
      V11-A · Alt A. Each bias is shared across all states for its own action, so the successor's outputs move although
      the successor was not in the loss. Step 1: left bias 0.1 × (+2 + 0)/2 = +0.10 (row one took L); right bias
      0.1 × (0 − 1)/2 = −0.05 (row two took R). Step 2: the online label would be 1 + 0.5 × max(4, 2) = 3 before and
      1 + 0.5 × max(4.1, 1.95) = 3.05 after. Step 3: the target network does not move until the copy.
      Save the pre-update, pre-copy snapshot of V09-A for 6.2 (D06-A).
      Only one worked-example route counts toward the targets.

