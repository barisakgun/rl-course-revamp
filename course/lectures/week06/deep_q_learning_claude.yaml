  - id: V14
    kind: math
    title: What changed in the update?
    body_box: [0.244, 1.1, 12.85, 3.0]
    size: 22
    body:
      - 'Which operation mixes correlated samples?'
      - 'Where does averaging reduce sampling variability?'
      - 'Which operation slows target motion?'
      - 'What can bias a bootstrap?'
    blocks:
      - box: [0.244, 4.1, 12.85, 1.8]
        size: 20
        items:
          - 'Replay mixes experience. The minibatch mean averages over samples.'
          - 'The delayed copy holds labels still between copies. Inaccurate value estimates can bias a bootstrap.'
      - box: [0.244, 6.0, 12.85, 0.8]
        size: 22
        items:
          - {text: '**Next time:** what happens when the target takes the largest of several noisy estimates?'}
    reveal: ['yaml:blocks.0', 'yaml:blocks.1']
    minutes: 3
    sources: ['old Deep QL PPTX 22 (summary)', 'Spring 2025 MT2 Q2 (bias, variance, non-stationary targets, correlated samples)']
    notes: |
      V14. The four questions are the old exam's four words (Spring 2025 MT2 Q2). Replay acts mainly on correlation
      and reuse; the minibatch mean can reduce gradient variance; the target network acts on non-stationary targets;
      neither removes bootstrapping bias. Close with the question that opens 6.2. End of 6.1.
