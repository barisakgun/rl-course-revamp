          - ['Gradient flows through the bootstrap', 'Inspect the label''s gradient path']
          - ['The copy happens too early, or never', 'Compare target weights across an ordinary step and a scheduled copy']
          - ['Only recent data reach the minibatch', 'Inspect sampled indices over repeated draws']
    reveal: ['yaml:tables.1']
