  - id: H01
    kind: math
    appendix: true
    hidden: true
    title: 'Appendix · Fitting Q from a batch, and parallel actors'
    body_box: [0.244, 1.1, 12.85, 5.6]
    size: 20
    body:
      - 'Neural fitted Q-iteration: recompute bootstrap labels on a stored transition set and fit a neural regressor to them. [Riedmiller 2005](https://www.machine-learning-lab.com/_media/publications/rieecml05.pdf)'
      - 'Tree-based fitted Q-iteration: fit successive regression targets on stored transitions with tree-based approximators. [Ernst, Geurts & Wehenkel 2005](https://www.jmlr.org/papers/v6/ernst05a.html)'
      - 'Asynchronous one-step and n-step Q-learning: parallel actor-learners update shared parameters from their own trajectories. [Mnih et al. 2016](https://arxiv.org/abs/1602.01783)'
    minutes: 0
    sources: ['old Deep QL PPTX 6–8 (parallel Q-learning, fitted Q-iteration)', 'deep_q_learning D7']
    notes: |
      H01. Hidden appendix (D7): methods the course does not cover. No live time, no assigned reading, no assessment.
      Links as given in the shared content; not opened by Claude at render.

  - id: H02
    kind: math
    appendix: true
    hidden: true
    title: 'Appendix · Changing replay, outputs and targets'
    body_box: [0.244, 1.1, 12.85, 5.6]
    size: 20
    body:
      - 'Prioritized replay: sample transitions with different probabilities, often by TD-error magnitude. [Schaul et al. 2016](https://arxiv.org/abs/1511.05952)'
      - 'Dueling networks: combine a state-value stream and an action-advantage stream into action values. [Wang et al. 2016](https://arxiv.org/abs/1511.06581)'
      - 'Multi-step deep Q-learning: accumulate several rewards before bootstrapping; part of Rainbow. [Hessel et al. 2018](https://arxiv.org/abs/1710.02298)'
    minutes: 0
    sources: ['old Deep QL PPTX 19–21 and 23 (prioritized replay, dueling, what is left)', 'deep_q_learning D7']
    notes: |
      H02. Hidden appendix (D7). Prioritized replay corrects its sampling bias with importance weights, which the
      course introduces in Week 8. Links as given in the shared content; not opened by Claude at render.

  - id: H03
    kind: math
    appendix: true
    hidden: true
    title: 'Appendix · Distributions, exploration and combinations'
    body_box: [0.244, 1.1, 12.85, 5.6]
    size: 20
    body:
      - 'C51: approximate the distribution of discounted returns on a fixed categorical support. [Bellemare, Dabney & Munos 2017](https://arxiv.org/abs/1707.06887)'
      - 'Noisy networks: learn the scale of parameter noise used for exploration. [Fortunato et al. 2018](https://arxiv.org/abs/1706.10295)'
      - 'Rainbow: combines Double DQN, prioritized replay, dueling networks, multi-step targets, distributional learning and noisy networks, with component ablations. [Hessel et al. 2018](https://arxiv.org/abs/1710.02298)'
    minutes: 0
    sources: ['old Deep QL PPTX 23 (Rainbow pointer)', 'deep_q_learning D7']
    notes: |
      H03. Hidden appendix (D7). Links as given in the shared content; not opened by Claude at render.
