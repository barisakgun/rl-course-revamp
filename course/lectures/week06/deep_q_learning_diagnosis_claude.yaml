    sources: ['review R05 (four checks)', 'A2 tasks 2 and 4 (hooks)', 'CS285 L8 p. 19 (test on easy tasks first)']
    notes: |
      D12. Students predict the check before the reveal. A correct numerical label can still carry a gradient path, so
      a fixed-output test alone does not catch the second bug. These are the four places A2's hooks can go wrong:
      terminal mask, detached target, copy schedule, uniform sampling. CS285: test on an easy, reliable task first.

