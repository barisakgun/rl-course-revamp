  - id: B22
    kind: math
    title: Why shorten policy evaluation?
    size: 24
    body:
      - 'A full policy evaluation may require many sweeps.'
      - 'Useful action choices may emerge before the values have settled.'
      - text: '**Must we finish evaluating each policy before making another improvement?**'
      - text: 'Value iteration combines a greedy choice with one backup using the current table.'
    minutes: 2.5
    sources: [old DP PPTX 25–26 (motivation, reordered after PI; erroneous V(s) successor removed), book §4.4 opening printed 82–83 / PDF 104–105, Silver L3 PDF 18, CS285 L7 PDF 9]
    notes: |
      Explain the order precisely: choose a policy greedily from the current V table; then do one evaluation backup
      for that chosen action using the same V table. Substitution folds the two operations into the max update on the
      next slide. This is the sense in which VI uses one evaluation sweep between improvements. It does not exactly
      evaluate the newly chosen policy, nor mean that one arbitrary old-policy evaluation sweep is itself the
      optimality update. Do not claim PI or VI is universally faster.

  - id: B23
    kind: math
    title: Value iteration
    size: 20
    eq_size: 22
    body:
      - text: 'For every nonterminal state $s\in\mathcal{S}$,'
      - eq: 'V_{k+1}(s)\leftarrow\max_{a\in\mathcal{A}(s)}[\mathcal{R}(s,a)+\gamma\sum_{s''\in\mathcal{S}^{+}}\mathcal{T}(s,a,s'')V_k(s'')]'
      - text: '1. Initialize $V_0$ to zero, including terminal entries.'
      - text: '2. Compute each new nonterminal entry using the **old** table.'
      - text: '3. Replace the table after the full sweep; keep terminal entries zero.'
      - text: '4. Repeat until the largest sweep change is sufficiently small.'
      - text: 'Extract a greedy policy using the final stored table $V$:'
      - eq: '\pi(s)=\arg\max_{a\in\mathcal{A}(s)}[\mathcal{R}(s,a)+\gamma\sum_{s''\in\mathcal{S}^{+}}\mathcal{T}(s,a,s'')V(s'')]'
    minutes: 4
    sources: [old DP PPTX 10–12 (converted), old DP PPTX 21–22 (convergence purpose, compressed), book §4.4 printed 83 / PDF 105, Silver L3 PDF 23–24]
    notes: |
      k counts sweeps, not environment time; this is a synchronous two-table implementation. Arbitrary nonterminal
      initialization is possible, but our example starts at zero. The max selects the action; outcome probabilities
      remain averaged. Terminal payoff is in ℛ, not added again through terminal V. A finite table is generally
      approximate; use π rather than asserting π^* for an arbitrary stopped table. Choose ties consistently (up,
      right, down, left when no current action is retained).
      One-line convergence explanation: in a finite discounted MDP, each action's average and then the maximum cannot
      enlarge the largest input discrepancy; discounting bounds the new largest discrepancy by γ times the old one.
      Repeated updates therefore approach v^*. A small sweep change is a practical stopping condition, not exact
      equality or a universal error certificate. Do not repeat the formal proof or iteration-count bounds.

  - id: B24
    kind: math
    title: A value-iteration sweep
    drawing: [*grid_plain]
    body_box: [3.6, 1.05, 9.5, 0.8]
    size: 20
    body:
      - text: '$\gamma=0.5$; living reward −0.04; +1 on goal entry, continuation 0; synchronous VI from $V_0=0$.'
    table:
      header: ['Sweep', '(1,1)', '(1,2)', '(2,1)', 'Terminal']
      rows:
        - ['$V_1$', '−0.04', '0.792', '0.792', '0']
        - ['$V_2$', '?', '?', '?', '0']
      widths: [1.6, 1.8, 1.8, 1.8, 1.8]
      size: 22
      row_h: 0.6
    table_box: [3.6, 2.0, 9.2]
    after_box: [0.244, 4.3, 12.85]
    after:
      - text: '**Compute $V_2((1,1))$ and identify the maximizing actions.**'
      - 'Every candidate action uses the same $V_1$ successor values.'
    minutes: 5
    sources: [old DP PPTX 13–16 (grid and exercise structure; all values replaced), book §4.4, decision C8]
    notes: |
      PROTECTED (with B24r). First check the supplied V₁: the first backup at (2,1) chooses up, giving
      0.8(+1) + 0.2(−0.04) = 0.792. Fixed always-right evaluation in 2.1 gave 0.064 there. Do not ask students to
