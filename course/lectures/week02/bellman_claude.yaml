sweep_header: &sweep_header ['Sweep', '(1,1)', '(1,2)', '(2,1)', 'Terminal']

slides:
  - id: B00
    kind: course_title
    title: COMP438/538 Reinforcement Learning
    topic: Bellman Equations and Dynamic Programming
    minutes: 0.5
    sources: [Introduction A21 title format]
    notes: |
      This deck covers Week 2. Today's portion develops policy evaluation and the Bellman optimality equations.

  - id: B01
    kind: math
    title: Evaluating a policy
    size: 24
    body:
      - text: '**How can we compute expected return when the task can continue indefinitely?**'
      - 'Given: a model of the environment and a policy.'
      - '**Prediction** (policy evaluation): calculate the policy''s state and action values.'
      - '**Control**: find a policy with higher expected return.'
      - text: 'Values account for delayed consequences and help us compare decisions.'
    minutes: 3
    sources: [old DP PPTX 3 and 38 (condensed), book §§3.5 and 4.1, accepted 1.2 closing question]
    notes: |
      LIVE (required): recall the open question after the robot's value table in 1.2, without repeating that
      table or its calculations. Averaging repeated returns has sampling variation, and stopping a continuing
      trajectory leaves a tail. A known model lets us average outcomes directly. The Bellman equation represents
      the entire future through successor values. A finite number of iterative updates can still be approximate;
      distinguish that later from solving the finite system exactly. Today the policy first stays fixed.
      Improving it is the next question.

  - id: B03a
    kind: math
    title: Gridworld as an MDP
    figure:
      deck: sources/current_course/2 - Markov Decision Processes.pptx
      slide: 37
      exclude: [Title 1, Rectangle 3, Slide Number Placeholder 3]
    drawing:
      - {label: '(4,3): **+1 on entry**   (4,2): **−1 on entry**', box: [7.45, 5.4, 5.4, 0.45], size: 18}
      - {label: 'Other transitions: living reward −0.04', box: [7.45, 5.85, 5.4, 0.45], size: 18}
    body_box: [0.244, 1.05, 7.1]
    size: 22
    body:
      - 'Actions: up, down, left, right'
      - 'Intended direction: 0.8; each perpendicular direction: 0.1'
      - 'A blocked movement leaves the agent in the same cell'
      - 'Entering either terminal cell ends the episode; no rewards follow'
      - '$\gamma=0.5$ for today''s examples'
    after_box: [0.244, 6.35, 12.85]
    after:
      - text: '**What are the states, actions, model, rewards and objective?**'
    minutes: 3
    sources: [old MDP PPTX 37/38/40 (map and rules; learning/planning block omitted), decisions C7/C8]
    notes: |
      Map: columns 1–4 left to right, rows 1–3 bottom to top. Start at (1,1); (2,2) is a wall.
      LIVE (required) / answers: the state is the accessible cell, with the grid and rules fixed. There are nine
      nonterminal cells (𝒮) and eleven accessible cells including the two terminals (𝒮⁺); the wall is not a state.
      The model describes the possible actual movements after an intended action. A policy chooses an action; it
      does not select which slip occurs. The objective is expected discounted return. On a terminal-entry
      transition the reward is +1 or −1 total, not that amount minus 0.04. Colliding with an outer boundary or the
      internal wall still incurs −0.04. These rules differ from the old nonzero terminal-value convention, so use
      no old computed values here.

  - id: B03
    kind: math
    title: A smaller grid for calculations
    drawing:
      - grid:
          x: 8.3
          y: 1.1
          cell: 1.6
          cols: 2
          rows: 2
          fills: {'2,2': goal}
          labels: {'1,1': '(1,1) start', '2,2': '(2,2) goal'}
