    kind: math
    title: 'Claim 3: “Same episodes means same cost”'
    body_box: [0.244, 1.0, 8.6, 1.6]
    size: 24
    body:
      - text: '“Both methods used 100 episodes, so their interaction and computation costs were equal.”'
      - text: 'Vote:  **supported**  or  **unsupported**?'
    pictures:
