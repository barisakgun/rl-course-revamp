      # n-step: n rewards, then V if still running
      - {line: [6.6, 1.50, 6.6, 1.62]}
      - {line: [6.6, 1.82, 6.6, 1.94]}
      - {line: [6.6, 2.34, 6.6, 2.46]}
      - {line: [6.6, 2.66, 6.6, 2.78]}
