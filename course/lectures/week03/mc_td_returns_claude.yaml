      - {line: [6.6, 3.85, 6.6, 3.97]}
      - {circle: [6.6, 1.3, 0.4]}
      - {circle: [6.6, 1.72, 0.2], filled: true}
      - {circle: [6.6, 2.14, 0.4]}
      - {circle: [6.6, 2.56, 0.2], filled: true}
      - {circle: [6.6, 2.98, 0.4]}
      - {circle: [6.6, 3.75, 0.2], filled: true}
      - {circle: [6.6, 4.17, 0.4]}
      - {label: '$V(S_{t+n})$ if still running', box: [6.9, 3.97, 3.4, 0.4], size: 18, center: false}
      # MC: rewards through termination
      - {line: [11.0, 1.50, 11.0, 1.62]}
      - {line: [11.0, 1.82, 11.0, 1.94]}
      - {line: [11.0, 2.34, 11.0, 2.46]}
      - {line: [11.0, 2.66, 11.0, 2.78]}
      - {label: '⋮', box: [10.70, 3.15, 0.6, 0.45], size: 22}
      - {line: [11.0, 3.85, 11.0, 4.0]}
      - {circle: [11.0, 1.3, 0.4]}
      - {circle: [11.0, 1.72, 0.2], filled: true}
      - {circle: [11.0, 2.14, 0.4]}
      - {circle: [11.0, 2.56, 0.2], filled: true}
      - {circle: [11.0, 2.98, 0.4]}
      - {circle: [11.0, 3.75, 0.2], filled: true}
      - {box: [10.45, 4.0, 1.1, 0.38], text: 'terminal', size: 14}
      # captions
