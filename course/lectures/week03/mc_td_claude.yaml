  - id: MT13a
    kind: math
    title: Discounted return and average reward
    body_box: [0.244, 0.95, 12.85, 2.3]
    size: 22
    eq_size: 24
    body:
      - text: '**Average reward: expected reward per step over a long run**'
      - text: 'For the policies in this service example, starting from ready:'
      - eq: 'r(\pi)\doteq\lim_{t\to\infty}\frac{1}{t}\mathbb{E}_{\pi}[R_1+R_2+\cdots+R_t\mid S_0=\text{ready}]'
    tables:
      - &avg_q
        box: [1.2, 3.4, 10.9]
        size: 20
        row_h: 0.55
        widths: [2.6, 3.3, 5.0]
        header: ['Policy', 'Average reward per step', 'Discounted return from ready, $\gamma=0.5$']
        rows:
          - ['Steady service', '?', '?']
          - ['Large jobs', '?', '?']
      - <<: *avg_q
        rows:
          - ['Steady service', '0.8', '1.6']
          - ['Large jobs', '(0 + 2)/2 = 1', '4/3 ≈ 1.333']
    after_box: [0.244, 5.45, 12.85]
    after:
      - text: '**The objective changes the ranking:** discounted return prefers steady service; average reward prefers large jobs.'
    reveal: ['yaml:tables.1', 'yaml:after']
    minutes: 3
    sources: [old Value Function Approximation PPTX 37 (average-reward definition, restricted to the time-average form), book §10.3 Eq. 10.6 printed 249 / PDF 271 (Eq. 10.7 not used)]
    notes: |
      About 1 minute students compute rates, 1 minute discounted comparison, 1 minute interpretation. Ask for the
      average-reward entries first; click: full table; click: ranking line. Show the rates as the proportion of
      total reward to elapsed steps. Discounted values:
      Steady: 0.8 + 0.5×0.8 + … = 0.8/(1−0.5) = 1.6.
      Large jobs: 0 + 0.5×2 + 0.5³×2 + … = 1/(1−0.5²) = 4/3.
      The job pays more per step in the long run but delays its first payment. This is an objective choice;
      neither objective is universally correct.
      The alternating policy is periodic. Its time average exists, but its individual expected rewards oscillate;
      do not write r(π) = lim 𝔼[R_t] or claim convergence to a stationary distribution. No ergodicity lesson is
      required. The displayed definition is scoped to this example, avoiding a claim that every MDP has a
      start-independent average reward.
      The discounted TD(0) rule taught earlier does not by itself learn this average-reward objective. No
      differential returns, differential Bellman equations, average-reward algorithm or approximation teaser here.
      MT13 and MT13a together keep exactly the accepted five-minute contrast.

  - id: MT14
    kind: math
    title: What can we learn before the episode ends?
    body_box: [0.244, 1.0, 12.85, 5.9]
    size: 24
    body:
      - 'MC updates toward a completed observed return.'
      - 'TD updates toward an observed reward plus estimated continuation.'
      - 'Both can evaluate a fixed policy from experience.'
      - text: '**Exit check:** Which needs the next state''s estimate? Which needs the completed return?'
      - text: '**Next session:** bias, variance, n-step targets and evaluating learning.'
      - text: '**Week 4:** improve policies using learned action values.'
    minutes: 1.5
    sources: [old Model-Free Prediction PPTX 6 (roadmap, reduced) and 29 (availability question)]
    notes: |
      TD uses the next estimate; complete-return MC waits for the return. Both methods here are model-free and
      on-policy; episode-based MC can still learn while collecting fresh data. The service example changed the
      objective, not these answers. Link back to GPI: greedy improvement using state values alone ordinarily needs
      a model for action lookahead; learning action values provides the next route. Do not give SARSA/Q-learning
      rules yet.
