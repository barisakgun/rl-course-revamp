# Session 1.1 (formulate): Introduction to reinforcement learning. Claude's deck source (renderer input).
#
# Build:  python3 scripts/build_deck_claude.py course/lectures/week01/introduction_claude.yaml [--render]
#
# Content authority until the instructor takes over the PPTX: the shared proposal
# course/lectures/week01/introduction_content.md (slide IDs I01–I10, I-A1), with outcomes in
# decisions/lectures/introduction.md. This file only translates that content for rendering
# (docs/lecture_workflow.md step 6); content changes go into the shared proposal first.
# After the instructor edits the PPTX, this file is kept in step with it (scripts/pull_deck_claude.py).
#
# Time budget: decisions/topic_decisions.yaml lecture_plan[formulate].teaching_minutes (42.5 since 2026-10-07).
# Appendix slides carry no teaching time.

deck:
  template: course/templates/lecture_template_claude.pptx
  output: course/lectures/week01/introduction_claude.pptx
  preview: output/lectures/week01/introduction_claude_preview.png
  session_id: formulate
  qa_minutes: 0                # questions are inside each segment's estimate (content proposal)
  title: Introduction to reinforcement learning (session 1.1)
  author: Barış Akgün
  term: Fall 2026              # course title slide (kind course_title)

slides:
  - id: I01
    kind: course_title         # instructor's title format (2026-10-08), used for all later decks
    title: COMP438/538 Reinforcement Learning
    topic: Introduction
    minutes: 0.5
    sources: [instructor title slide format, 2026-10-08]
    notes: |
      The course briefing is already done, so skip the syllabus and prerequisites. Frame the session in one line:
      how can an agent learn to make good decisions from experience and from feedback on their consequences?
      The brainstorm on the next slide starts the discussion.

  - id: I01a
    kind: pptx_only
    title: Brainstorm
    minutes: 2
    sources: [instructor slide authored in PowerPoint]
    notes: "Target: 2 min\n"
  - id: I01b
    kind: bullets
    title: Decision Making
    bullets:
      - What “**action**” should I take to maximize my “**expected**” outcome given the current “**situation**”?
      - Any ideas…
      - 'In real life:'
      -   - Need to make sequential decisions
          - Outcomes of actions are uncertain
          - There is limited information
          - Rewards can also be uncertain (at least unknown before getting them)
      - 'Reinforcement Learning: “Learning to make decisions by interacting with the environment”'
    minutes: 1.5
    sources: [instructor slide added in PowerPoint]
    instructor_voice: [whole slide]
    verify: []
    notes: "Target: 1.5 min\n"
  - id: I01c
    kind: pptx_only
    title: Robots!
    minutes: 0.5
    sources: [instructor slide authored in PowerPoint]
    notes: "Target: 0.5 min\n"
  - id: I01d
    kind: pptx_only
    title: Famous Atari Example
    minutes: 1
    sources: [instructor slide authored in PowerPoint]
    notes: "Target: 1 min, I will move the animation ahead\n"
  - id: I02
    kind: image_grid
    title: 'Reinforcement Learning Examples: Why RL?'
    cells:
      - heading: Go — AlphaGo, 2016
        caption: Improving play through self-play
        credit: "Image: Google DeepMind"
        image: {path: course/lectures/week01/introduction_media/alphago_deepmind.jpg}
      - heading: Fusion — DeepMind and EPFL, 2022
        caption: Learning to control plasma shape
        credit: "Illustration: Google DeepMind"
        image: {path: course/lectures/week01/introduction_media/plasma_deepmind.jpg}
      - heading: Robot movement — ANYmal, 2019
        caption: Learning movement in simulation, then using it on a real robot
        credit: "Image: Hwangbo et al., Science Robotics, 2019"
        image: {path: course/lectures/week01/introduction_media/anymal_hwangbo2019.jpg}
      - heading: Language — ChatGPT, 2022
        caption: Improving responses with feedback learned from human comparisons
        drawn: comparison
    minutes: 3
    sources: [DeepMind AlphaGo page, DeepMind plasma control blog 2022-02-16, Hwangbo et al. 2019 (arXiv 1901.08652), OpenAI Introducing ChatGPT 2022-11-30]
    notes: |
      Each example gets one point, not its own technical explanation.
      - AlphaGo combined human-game training, reinforcement learning and search (2016 Lee Sedol match; not the later AlphaGo Zero).
      - Fusion refers to plasma control on the TCV tokamak with EPFL, not a claim that RL solved energy production.
      - ANYmal's controller was trained in simulation and transferred to the real robot.
      - The historical ChatGPT pipeline included supervised training as well as RL using a reward model learned
        from human comparisons; this is not a claim that every user click immediately trains the deployed model.
      No current-best or universal-adoption claims.
      Links: https://deepmind.google/research/alphago/ ;
      https://deepmind.google/blog/accelerating-fusion-science-through-learned-plasma-control/ ;
      https://arxiv.org/abs/1901.08652 ; https://openai.com/index/chatgpt/
      If the briefing has already overrun, shorten narration to about 2.5 minutes but keep all four examples.

  - id: I03
    kind: table
    title: How does RL differ from other learning methods?
    table:
      header: [Learning setting, Typical learning signal]
      rows:
        - [Supervised learning, Examples of the desired output]
        - [Unsupervised learning, "Structure in the data, without target labels"]
        - [Reinforcement learning, Rewards from the consequences of actions]
      widths: [4, 8]
      align_left: true
    bullets:
      - "In RL, actions affect later experience. A reward need not tell us which action was best."
    bullet_style: none
    minutes: 2
    sources: [current Introduction PPTX 51, CS224R introduction p. 8, CS234 introduction pp. 16–17, book §1.1]
    notes: |
      A short contrast, not a taxonomy lecture. Rewards can arrive immediately; consequences can also appear much
      later. Learning methods can be combined, as the motivation examples illustrate. Do not say "no teacher/labels"
      or that all supervised data must be independent: describe RL's feedback and decision problem rather than
      defining it only by the absence of labels.

  - id: I04
    kind: native_bullets
    title: Agent and environment
    native:
      deck: sources/current_course/1 - Introduction.pptx
      slide: 42
      shapes: [Group 42]
      relabel: {Percepts: Observations}
    bullets:
      - The agent chooses an action. (Based on what?)
      - The environment responds with an observation and a reward.
      - A policy describes how the agent chooses actions.
    bullet_style: none
    minutes: 2
    sources: [current Introduction PPTX 42 (native diagram; body text replaced)]
    notes: |
      A policy may choose an action or assign probabilities to actions; no policy notation or probability
      calculation here. The agent–environment boundary depends on what decisions we choose to study.
      Use the diagram as a bridge to the robot, not a second full formulation exercise.

  - id: I05
    kind: bullets              # was a blank canvas; the instructor added a title and prompts (2026-10-06)
    title: "Concrete Example: Recycling Robot"
    bullets:
      - Mobile robot in an office
      - Its task is to collect empty cans
      - Solve it with RL
      -   - “robot”
          - “office”
          - “interaction”
          - “decisions”
          - “learn”
    minutes: 7
    sources: [Sutton & Barto Example 3.3 (printed pp. 52–53)]
    notes: |
      Live discussion canvas (instructor's gradual reveal). Consistency reference, not a script:
      - Task: collect empty cans over time. High-level decisions: search, wait, recharge; motor control is outside the model.
      - Book formulation: observed charge is high or low. High: search or wait. Low: search, wait or recharge.
        Omitting high-charge recharge is a modelling choice, not a physical impossibility.
      - Search from high completes without rescue and leaves high or low. A successful search from low stays low;
        depletion means rescue and a return to high. Waiting leaves the charge unchanged; recharging returns it to high.
      - Illustrative rewards: successful search 2, wait 0, recharge 0; a depleted search gives −3 on that transition
        and collects no cans. 2 and 0 are teaching simplifications; the book's wait reward (someone brings a can) is ignored. Probabilities appear on the figure slide.
      - The task continues; the aim is to collect cans while accounting for rescue costs, not to avoid all risk.
      - Let students propose information, actions and feedback; discuss other defensible formulations before naming
        the book's. No fixed pair exercise.

  - id: I06
    kind: bullets
    title: Reward and return
    bullets:
      - '**Reward:** Feedback for each step (i.e. each time an action is taken).'
      - '**Return:** Added up "future" rewards (later ones may count less).'
      -   - 'Another interpretation: the rewards still to come'
          - Can be defined for each time step!
      - Recharging earns nothing immediately, but changes what can happen next. (0 reward yet it is important for success)
    minutes: 2
    sources: [current Introduction PPTX 49–50, book §§3.2–3.3]
    notes: |
      In the upcoming episodic/discounted setting, the return adds future rewards, possibly discounting later ones;
      the precise objective and calculations are 1.2. Contrast high-charge search and waiting if useful: search earns
      more now under our numbers but can leave less charge for later. This exposes a future consequence; it does not
      establish that waiting is better. Do not claim low-charge search pays 2 before a separate later rescue penalty.

  - id: I08
    kind: bullets
    title: Learning from experience
    bullets:
      - If the robot is not given the consequences of its actions, how could it learn them?
      - On a trial, it observes what happened for the action it chose, not directly what the alternatives would have produced.
      - '**Exploration:** trying actions to learn more.'
      - '**Exploitation:** using what it has learned to obtain reward.'
    minutes: 3
    sources: [CS234 introduction p. 17, Silver introduction pp. 37–42, current Introduction PPTX 51]
    notes: |
      The battery gauge is still visible here: the uncertainty is about action consequences, not hidden charge.
      Students can suggest trying actions and comparing repeated experience; experiments can cost reward. Do not
      claim one failed trial settles a comparison, or that the unchosen action can never be learned about later.
      Planning contrast, spoken only if it fits (skip first if the robot discussion overran): with a usable model of
      the consequences, the robot can compute ahead (planning). It can also learn a model from experience and then
      plan with it. Knowing the model does not make stochastic outcomes certain.

  - id: I09a
    kind: bullets
    title: Observation and state
    bullets:
      - '**Observation:** what the agent receives now (e.g. through its sensors)'
      - '**State:** a description used to predict consequences and choose actions.'
      -   - A useful state must retain the information that matters for what happens next and ideally not include irrelevant information, sort of an “abstraction”
          - Built from observations
      - The battery gauge is hidden. You have just collected two cans.
      - '**Is the battery high or low?**'
      - '**What earlier events could help you decide what to do next?**'
    minutes: 4
    sources: [book Example 3.3 (adapted sensor question), CS234 introduction pp. 35–38, Silver introduction pp. 18–24]
    notes: |
      I09a and I09b share four minutes. Intended answer: two cans alone do not identify the charge; a successful
      search can end at high or low. Recent recharging, searching and rescue events inform what the agent knows,
      without necessarily identifying the true charge. Consider only search vs wait: show no action-availability or
      base-location cue that would reveal the charge. Do not ask students to prove a search count is sufficient.

  - id: I10
    kind: bullets
    title: Formulating a decision problem
    bullets:
      - 'For the recycling robot:'
      -   - What decisions does it make, and what feedback does it receive?
          - Why might the latest observation be insufficient?
          - Why doesn't one good outcome settle which behaviour to use?
    minutes: 2
    sources: [current Introduction PPTX 19, accepted formulate/mdp_values boundary]
    notes: |
      Brief student answers, not another vocabulary lecture. Actions are search/wait/recharge; rewards evaluate
      consequences, not the identity of a correct action. Hidden charge can make the latest observation insufficient.
      One outcome does not supply the distribution of future consequences. Next session: values, and continuing vs
      episodic tasks. No reading, video or extra exercise. If short of time, keep only the bridge sentence.

  - id: I05b
    kind: pptx_only
    title: 'Concrete Example: Recycling Robot'
    minutes: 9
    sources: [instructor slide authored in PowerPoint]
    notes: "Figure redrawn from Example 3.3 with numbers instead of symbols: at high, search stays high with 0.8 (drops to low 0.2); at low, search stays low with 0.7, otherwise the battery runs out and the robot is rescued and recharged to high (0.3, −3). Drawn natively in PowerPoint by the instructor, with colours matching the formulation bullets; first draft in introduction_media/recycling_robot.dot.\nOther versions: if time allows, draw them on the figure: (a) a 'rescued' state with a probability-1 transition to high; (b) an 'out of battery' terminal state (e.g. reward −10) instead of the rescue. If not, just state them verbally.\n\nExample transitions on the slide (illustrative rewards, search always +2 as in the book): always search 2, 2, −3 (rescued), 2 = 3 over four steps; search when high / recharge when low 2, 2, 0, 2 = 6.\n\"Returns?\": these are partial sums of a continuing task. \"Which strategy is better?\" Intended answer: one outcome does not establish it; a low-charge search could also succeed (+2); the comparison needs expected returns, which 1.2 defines.\n"
  - id: I-A1
    kind: table
    title: "Summary: Recycling robot, simplified formulation"
    table:
      header: [Component, Choice in this example]
      rows:
        - [Decisions, 'Search, wait, recharge']
        - [State (same as observation for this example), High or low battery charge]
        - [Model, 'Search may lower the charge: from high it stays high with 0.8 (else low); from low it stays low with 0.7 (else the battery runs out and the robot is rescued to high). Wait keeps the charge; recharge returns it to high.']
        - [Reward, 'Successful search: 2; wait: 0; recharge: 0; depletion/rescue: −3']
        - [Objective, Collect cans over time while accounting for rescue costs]
        - [Horizon, Continuing]
      widths: [4, 8.5]
      align_left: true
      size: 20
      row_h: 0.62
    sources: [Sutton & Barto Example 3.3, deck decisions A12]
    notes: |
      Formulation prompts for later project work: what decisions, what
      information, what reward, over what horizon? (Separate checklist proposal O8 is still open.) Optional backup:
      if a cleaning robot can dump and recollect dirt, rewarding collected dirt rewards that loop.
    minutes: 0.5
  - id: I11
    kind: bullets
    title: Why is RL different?
    bullets:
      - 'Learns from **evaluative** feedback (rewards: how good was what I did?), not only **instructive** feedback (labels: what should I have done?)'
      -   - and can also use a teacher when available, e.g. human game records (AlphaGo) or human comparisons (ChatGPT)
      - Decisions are made sequentially (agent paradigm) – not i.i.d.!
      - Agent’s actions affect the subsequent data it receives
      - Feedback is usually delayed (action now may have a huge impact in the future)
      - '**Next:** Define the model, the return objective and the policy.'
    minutes: 2
    sources: [instructor slide added in PowerPoint]
    instructor_voice: [whole slide]
    verify: []
    notes: "Target: 2 min\n"
