      - "The make-up exam can be written or oral"
      - "Students need to notify the instructor or the university within 5 days of the exam"
      - "There will be no make-ups for the make-up exam"
      - "you need to contact the instructor before week 10 to schedule an early exam"
      - "There will be no tolerance for cheating, plagiarism"
    notes: |
      [0:45] Read quickly; the details are in the syllabus.

