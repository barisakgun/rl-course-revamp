delivery_policy:
  buffer_use: Retain the configured 0.85 fraction for advance planning. The instructor may use the generic buffer
    when needed during delivery, trading off questions, examples, consolidation or overruns minute-for-minute. Do
    not count the same buffer twice.
  questions: Longer questions may be handled at the end of a lecture, with a brief next-lecture recap when relevant
    to the class. Required clarifications must remain available to all students; a recap also consumes time.
  pacing_judgment: Instructor judges pacing doable and has accepted the reviewed masteries, with teaching-time adjustment
    for pacing and student interest.
mastery_review:
  state: accepted
  date: '2026-09-28'
  source: Instructor reviewed masteries and found them in good shape; may fine-tune according to pacing and student
    interest.
  delivery_flexibility: Instructor may calibrate depth and examples during teaching. Material changes to the shared
    curriculum or assessed expectations should be reflected in decisions when made; no new blanket assessment requirements
    are inferred.
phase4_authorization:
  date: '2026-09-28'
  source: Instructor confirmed Conservative Q-Learning and authorized starting Phase 4 if no Phase 3 blockers remain.
  freeze_state: frozen
  note: Instructor explicitly accepted curriculum freeze and authorized Phase 5 grading, project and reading work;
    detailed assignment design is deferred.
lecture_plan:
- id: formulate
