schema_version: 2
curriculum_state: frozen
authority: Accepted curriculum scope, role, mastery, scoped status, delivery and baseline lecture sequence. Session
  minutes/ranges are accepted planning estimates, not measured durations; assessment designs remain Phase 5 work.
acceptance_source: Instructor response to Phase 3 iteration 1, R1-R6 and C1-C5, 2026-09-28
constraints:
  policy_live_lectures: 5
  policy_history_live_minutes: 10
  average_reward_live_minutes: 5
  backward_trace_math: false
  bandit_live_lectures: 1
  psychology_neuroscience_separate_block: false
  sac_live_minutes: 30
