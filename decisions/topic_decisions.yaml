    (59-61) in Week 2, here alongside expectation backups. Use a short model-prediction example where useful;
    do not defer this elementary probability reasoning to policy gradients. Integrate with the existing
    worked backup, replacing repeated setup or expansion, not adding another exercise block. Protect
    policy-evaluation sweeps within the existing 58 minutes; exact example and local split are preparation choices.
