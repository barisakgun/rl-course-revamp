    trying to fill the allowance. This is a ceiling using this lecture's buffer, not a new 65-minute target.
  group_ids:
  - formulation
  requires:
  - formulate
  worked_activity: Compute returns and define a policy/model/value on the running MDP.
  feasibility_note: Instructor 2026-10-07 accepts the consolidated revision in deck decisions B12-B15,
    targeting approximately 62 minutes; 65 remains an allowed ceiling, not a target. The 62-minute plan
    uses 2.5 minutes of the 59.5-minute usable-content budget's general buffer, leaving 8 physical minutes.
    Representation and partial observability remain conceptual. Protect model-table interpretation,
    the return calculation, continuing tail and always-wait value reasoning. The live discount motivation,
    horizon contrast and value interpretation replace compressed explanations; no extra solver or exercise
    block is added. The title takes 0.5 minute from the closing recap; the net addition uses four minutes
    of previously unallocated session capacity. Backups are unassigned and notes-only; no hidden workload.
    Do not charge 1.1 carryover. Week 2 placements are recorded under bellman and improvement; the decision
    on detailed search-tree framing is deferred to preparation of the search/model-based RL portion (see mcts).
  confidence: medium
