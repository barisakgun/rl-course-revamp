    scalar example; distinguish recent-batch reuse from arbitrary replay. No PPO convergence guarantee or full implementation
    requirement.
  delivery:
  - live
  mastery:
  - explain
  - analyze
  role: core
  status:
  - foundational
  - current-practice
  status_scope: Importance sampling and entropy are foundational concepts. PPO is a contemporary baseline in the
    cited 2025 MuJoCo/control benchmarking scope; not a claim of universal deployment or superior performance. See
    analysis/phase4_review.yaml status_evidence.
