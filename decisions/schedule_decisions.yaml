  - 150
  - 180
  instructor_judgment: Workload acceptable; current estimated ranges may be somewhat high. Preserve uncertainty
    and calibrate during concrete task preparation.
syllabus_review: Current combined syllabus content looks acceptable to instructor; final document format and dated
  calendar remain open.
freeze:
  scope: Week-level schedule, assessment sequence and presentation delivery; exact dates remain unbooked. Not final
    syllabus/design freeze.
  reopen_trigger: After the first two weeks of classes, when attendance and registration stabilize.
  review_inputs:
  - Student timetable and stable registration/attendance
  - TA availability
  - October/November/December makeup slots
  - Exact assignment/exam dates and prerequisite coverage
  - Presentation slots and grading arrangements
  - Official letter-grade deadline and grading turnaround
  instruction: Reopen calendar mapping at that checkpoint; preserve teaching scope unless explicitly revised.
