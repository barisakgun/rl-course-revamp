audit_notes:
  verdict: Frozen curriculum updated only through accepted bounded Double DQN/IQL mastery revisions and maximization-bias
    role clarification. Weekly sequence and live-time totals are unchanged. Phase 6 integrates the accepted assessment
    and video scheduling rules.
  protected_depth:
  - Bellman derivation and improvement example
  - MC/TD shared trajectory and SARSA/Q target comparison
  - Linear update and worked divergence
  - REINFORCE/baseline derivation and actor-critic/GAE bridge
  - Experimental diagnosis, coverage and reward failure examples
  pressure_response: Use the explicit local margins and, when needed, the instructor-authorized generic delivery
    buffer. Spending buffer displaces questions/consolidation, rather than creating additional time. Preserve a
    worked n-step target before GAE. A Week 1 MDP shift only relieves Week 2 if it also enables Bellman groundwork
    earlier. Keep optional mentions bounded; record required video scope/workload changes at the agreed checkpoints.
  workload: Live teaching time is not student workload. The two substantive prerequisite videos have separate playback
    and study-time estimates; durations are proposals. Presentations outside class, assignments, projects and required
    readings remain for later workload design. Supplementary policy video is only a contingency, not required work.
accepted_topics_source: decisions/topic_decisions.yaml
accepted_videos_source: decisions/video_decisions.md
policy_audit:
  session_ids:
  - reinforce
  - baseline
  - actor_gae
  - ratios
  - ppo_contrast
  confidence: low-to-medium
  scope: Thirty-minute SAC mechanism treatment with reusable DQN machinery; foundational estimator derivations and
    ten-minute history retained. Ten minutes released relative to the previous candidate; no full SAC/PPO implementation
    workshop.
  pace_stress_fraction: 0.15
  contingencies:
  - name: Recorded follow-up if the first three sessions run long
    minutes_range:
    - 15
    - 25
    state: unaccepted contingency
    action: Review at the Week 8 video checkpoint whether a policy-search/SAC supplement is useful. The instructor
      may first use generic delivery buffer; any required supplement must have scope, preparation timing and student
      effort recorded before use.
    workload: Would add approximately 20–35 student minutes; obtain a delivery decision and rerun the audit before
      using.
  - name: More depth than mechanism-level SAC
    minutes_range:
    - 20
    - 35
    state: unaccepted extension scenario
    action: A full soft policy-iteration derivation or implementation walkthrough would need additional time; preserve
      the five-session target by choosing video delivery or displacing other live content explicitly.
    workload: Implementation practice and compute remain unestimated.
optional_scenarios:
- id: least_squares_td
  accepted_suggestion_ref: least_squares_td
  teaching_minutes: 5
  session: offline_failure
  state: not_in_base_allocation
  replacement: May use five minutes of the BC compression margin in the first offline session instead of displacing
    the IQL example. It competes with the tentative five-minute IRL mention; do not automatically schedule both.
  recommendation: Explicit optional note only, excluded from base allocation. BC supplies the direct supervised-policy
    connection; LSTD is a batch TD fixed-point method, not ordinary regression on observed value labels.
  proposed_role: exposure
  proposed_mastery:
  - recognize
  proposed_status:
  - classical
  proposed_delivery:
  - live
  proposed_assessment:
  - none
pacing_options:
- id: early_mdp
  state: instructor_contingency_not_reallocated
  scope: Pull some MDP content into 1.1 if the first lecture permits; no assumed saving unless 1.2 then carries
    some Bellman groundwork.
- id: n_step_trim
  state: instructor_contingency_not_reallocated
  scope: Shorten repeated n-step target examples in 3.2 while retaining one worked target and the sampling/bootstrapping
    contrast needed by GAE.
- id: irl_mention
  state: tentative_not_in_base
  topic_id: inverse_rl
  week: 12
  minutes_if_used: 5
  scope: Distinguish inferring rewards from demonstrations from BC/action imitation; no inverse-RL derivation. Competes
    with optional LSTD for the same BC margin.
