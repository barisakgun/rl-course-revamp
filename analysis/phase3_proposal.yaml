assumptions:
  timing: Instructor planning estimates, not observed delivery. Integrated teaching blocks are the unit of time;
    topic IDs carry no additive minutes.
  confidence: Medium for foundational block scope; low for new modern units and total student workload.
  mastery: Reviewed mastery is accepted and stored only in decisions/topic_decisions.yaml. Implementation expectations
    concern representative methods within the bounded scope, not every ID. Instructor may fine-tune teaching depth
    with pacing and interest.
  status: Accepted scoped status labels are stored in decisions; primary-source rationale remains in analysis/phase4_review.yaml.
    No SOTA or deployment-prevalence claim.
  presentations: Outside class as configured; presentation attendance/preparation remain separate workload.
  extensions: Optional extensions have no compulsory workload. A backward-trace mention replaces the former optional
    backward-math route; no backward math is included.
