drop_policy_consequence: Accepted best-three grading permits omitting an implementation-bearing assignment. Midterms
  check reasoning but do not replace direct implementation evidence, and project choice does not guarantee matching
  coverage. All frozen masteries remain intended learning targets; per-student evidence is incomplete for an omitted
  area. No hidden all-four completion requirement is introduced; best-three aggregation does not itself change the
  accepted topic masteries.
rubric_source: decisions/assignment_decisions.md#/refinements/rubric
curriculum_revision_proposals:
- id: DDQN_PATCH
  state: accepted
  topic_ids:
  - double_dqn
  change: Move only Double DQN out of the mixed Exposure group into a bounded Core implement/explain entry for the
    target-function patch; keep tabular Double Q/maximization-bias treatment at existing scope. Accepted by instructor.
  reason: A small edit reuses the actual DQN loop and avoids a separately authored/hand-graded use case.
  displacement: Replaces the separate double-estimator assignment exercise. No additional benchmark; target/terminal
    tests are automatic.
  prerequisites: DQN online/target networks and maximization-bias discussion in 6.2; no new architecture.
  live_minutes_added: 0
  live_reallocation: As accepted, use about 3–5 minutes within the existing 20-minute double-estimator block in
    6.2 to map selection versus evaluation to the target code, replacing part of the numerical walkthrough. This
    is an estimated substitution, not added time.
  student_time: About 0.5–1 hour for the patch/tests, funded by removal of the separate use case; A2 estimate stays
    10–14 hours.
  delivery: Implementation details in self-contained starter comments/tests; no extra mandatory video/reading.
  assessment: Bounded automatic correctness checks, not guaranteed performance improvement.
- id: IQL_IMPLEMENTATION
  state: accepted
  topic_ids:
  - implicit_q_learning
  change: Add implement to IQL mastery only for the three core loss/update functions in a supplied learner; retain
    Core explain/analyze and retain CQL Exposure/explain. No full from-scratch system or CQL implementation.
  reason: Aligns the fourth task with the named offline method already taught and reduces the large workload disparity
    under best-three grading.
  displacement: Replaces interpretation-only A4 and moves CQL conceptual assessment to midterm 3. Use supplied baselines,
    loop and utilities; no extra algorithm survey.
  prerequisites: TD targets/regression, policy log likelihood, frozen expectile and advantage-weighted fitting material
    in 12.2. Supply gradient-stop and numerical-stability conventions.
  live_minutes_added: 0
  live_reallocation: As accepted, map equations to the three loss interfaces during about 5–8 minutes of the existing
    10-minute IQL worked-example segment in 12.2, using the same example rather than adding a second one. Estimate;
    59-minute session total is preserved.
  student_time: A4 increases from 3–5 to 9–13 active hours, including scaffold/API preparation. Pilot before committing
    to difficulty.
  delivery: Self-contained assignment instructions; no new reading/video. If the scaffold needs additional compulsory
    teaching, identify displacement and rerun the audit instead of borrowing uncounted time.
  assessment: Automated losses/gradients plus bounded support/evaluation analysis. January deadline independent
    of midterm 3.
primary_checks:
- title: Double DQN
  url: https://arxiv.org/html/1509.06461v3
  locator: Double DQN section
  claim: Separates online action selection from target-network evaluation; supports reuse of existing DQN machinery.
  retrieved: '2026-09-28'
- title: PPO
  url: https://arxiv.org/pdf/1707.06347
  locator: Section 3, clipped surrogate
  claim: Clipped surrogate motivates a controlled update-behavior experiment; it is not a hard bound on policy movement.
  retrieved: '2026-09-28'
- title: IQL
  url: https://arxiv.org/pdf/2110.06169
  locator: Section 4, value/Q fitting and policy extraction
  claim: Expectile value fitting, Q regression and advantage-weighted policy extraction provide three bounded coding
    targets.
  retrieved: '2026-09-28'
staffing_audit:
  manual_minutes_per_submission:
    A1:
    - 2
    - 4
    A2:
    - 3
    - 5
    A3:
    - 6
    - 8
    A4:
    - 5
    - 7
  confidence: Low; targets for routine review with tested autograding, standardized tables and short answers, including
    a brief disclosure check. Excludes code/scaffold development, autograder construction, reference-run pilots,
    unusual failures, appeals and integrity investigations.
  scaling: Let N be enrollment. If everyone submits all four, manual-review hours are N times the sum of per-assignment
    minutes divided by 60. Best-three grading may still mean four submissions per student.
  controls:
  - One shared submission schema and automated correctness checks.
  - No separate hand-computed target exercise, double-estimator case study or long derivation report.
  - PPO and IQL retain at most two focused interpretations each.
  - No human grading based on whether a noisy benchmark improves; verify implementation and reasoning.
  - Rubric percentages and exact response caps are deferred until tasks are concrete.
  risk: With zero TA, upfront scaffold/testing work is the main unresolved cost. If those resources cannot be prepared,
    provide more PPO/IQL scaffolding and review task size with the instructor. Removing the accepted Core DDQN patch
    would require an explicit scope/mastery revision; do not claim automation is free or lower frozen mastery silently.
fairness_audit: 'Planning ranges now overlap: A1 9–13, A2 10–14, A3 10–14, A4 9–13 hours. This is a planning target,
  not proof of equal difficulty. Pilot completion time and score attainability; distinguish correctness, controlled
  experimentation and concise explanation across all four. Do not inflate A4 with unnecessary runtime/reporting.
  Best-three still allows strategic omission; the accepted policy is unchanged.'
