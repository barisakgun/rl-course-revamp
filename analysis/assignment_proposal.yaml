workload_assumptions: Low-confidence active student-hour estimates, including setup familiarization, coding, bounded
  runs, interpretation, writeup and LLM-use documentation. Assume supplied working scaffolds, Python/basic ML background
  and small CPU tasks. No measured pilot yet; unattended compute is separate. These are not source-course duration
  estimates.
compute_targets: 'Before release, pilot the complete required workload on a representative student laptop: quick
  correctness tests under a minute and all required training runs within roughly one hour per coding assignment,
  as targets not verified measurements. Prefer fixed small configurations; preserve one short student-owned end-to-end
  run if supplied traces replace longer experiments. No GPU/HPC access or paid model API required.'
llm_operational_proposal:
  accepted_rule_source: decisions/assignment_decisions.md#/llm_use
  interpretation: The report requirements are accepted. Keep the previously accepted no-credit direction for one-/few-shot
    solution delegation; distinguish it from ordinary focused assistance when operationalizing the final rubric.
    An example report will be prepared with the concrete assignments, not now.
  grading_scope_pending: Deferred to in-semester concrete rubric work by instructor direction; does not block Phase
    5 closure. No extra penalty is inferred.
  exam_checks: Recommend a small unfamiliar variant of an assignment concept within the existing midterm blueprint
    and taught mastery. These replace comparable exam questions; no extra exam/grade category. A4 cannot be a prerequisite
    for midterm 3 because its due date follows that exam.
  report_source: decisions/assignment_decisions.md#/llm_use/report_requirements
